intent: >-
  Unify Main, Settings, Notes, and Tasks navigation sidebars behind one
  authoritative shared CSS anatomy while preserving controller hooks,
  per-surface semantics, dirty Settings work, and responsive accessibility.

shared_contract:
  stylesheet: jin-gui/src/styles/navigation.css
  standard_rail_width_px: 184
  row:
    min_height_px: 32
    padding_block_px: 0
    padding_inline_px: 10
    gap_px: 8
    radius_px: 6
    font_size_px: 13
    line_height_px: 18
  anatomy:
    - jin-navigation-rail
    - jin-navigation-list
    - jin-navigation-row
    - jin-navigation-row__icon
    - jin-navigation-row__label
    - jin-navigation-row__meta
    - jin-navigation-row__actions
  variants:
    - jin-navigation-row--tree
    - jin-navigation-row--actions
    - jin-navigation-row--inset
  selected_state:
    page_navigation: aria-current=page
    tree_navigation: aria-selected=true
    visuals:
      - workspace-row-selected wash
      - 3px ink marker

included_surfaces:
  - Main navigation links and Settings entry
  - Settings category navigation
  - Notes folder tree, All Notes, and saved collections
  - Tasks smart views and user lists

excluded_surfaces:
  - Notes content list rows
  - Task content list and board items
  - Notifications master-list rows
  - Today, event, and calendar rows
  - Menus, dialogs, popovers, toolbars, forms, and detail panes

declared_scope:
  - jin-gui/index.html
  - jin-gui/src/styles/tokens.css
  - jin-gui/src/styles/index.css
  - jin-gui/src/styles/components.css
  - jin-gui/src/styles/navigation.css
  - jin-gui/src/styles/layout.css
  - jin-gui/src/styles/browse.css
  - jin-gui/src/styles/settings.css
  - jin-gui/src/styles/a11y.css
  - jin-gui/src/lib/lists/render.ts
  - jin-gui/src/controllers/notes_controller.ts
  - jin-gui/src/__tests__/notes_visual_system.test.ts
  - jin-gui/src/__tests__/lists_controller.test.ts
  - jin-gui/src/__tests__/notes_controller.test.ts
  - jin-gui/src/__tests__/settings_controller.test.ts

dirty_worktree_contract:
  baseline: current uncommitted Settings implementation
  prohibited:
    - whole-file replacement of dirty Settings files
    - git checkout or reset of dirty Settings files
    - regeneration from HEAD
  evidence_root: .spectra/plans/navigation-sidebar-unification.evidence
  required:
    - settings-baseline.patch
    - settings-baseline.json
    - settings-preservation.json

migration_stages:
  - id: S1
    title: Establish shared navigation contract
    depends_on: []
    timebox_days: 1.5
  - id: S2
    title: Migrate Main and preserve Settings work
    depends_on: [S1]
    timebox_days: 1
  - id: S3
    title: Migrate Notes navigation
    depends_on: [S2]
    timebox_days: 1.5
  - id: S4
    title: Migrate Tasks navigation and actions
    depends_on: [S3]
    timebox_days: 2
  - id: S5
    title: Remove duplicated visual ownership and harden accessibility
    depends_on: [S4]
    timebox_days: 1
  - id: S6
    title: Verify migration and preserve evidence
    depends_on: [S5]
    timebox_days: 1

rollback:
  - Keep legacy feature classes as compatibility hooks throughout migration.
  - Reverse only the failing stage's shared-class additions and selector removals.
  - Keep --context-rail-width as an alias until all consumers pass.
  - Use reverse patches for dirty Settings hunks; never restore from HEAD.

verification:
  maker: vivi
  checker: vigil
  maker_checker_distinct: true
  focused_command: npm --prefix jin-gui test -- src/__tests__/notes_visual_system.test.ts src/__tests__/lists_controller.test.ts src/__tests__/notes_controller.test.ts src/__tests__/settings_controller.test.ts
  css_lint_command: npm --prefix jin-gui run lint:css
  build_command: npm --prefix jin-gui run build
  full_test_command: npm --prefix jin-gui test
  diff_command: git diff --check
  browser_viewports:
    - 1280x800
    - 720x800
    - 390x844
  geometry_tolerance_css_px: 0.5
  evidence_manifest: .spectra/plans/navigation-sidebar-unification.evidence/manifest.json
  native_limit: Native Tauri, WKWebView, WebKitGTK rendering, and platform feel require owner sign-off.

acceptance_checks:
  - id: AC-NAV-001
    form: ubiquitous
    then: "the shared navigation rail width token SHALL resolve to 184px at standard text scale"
    verify_method: "static token assertion in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-002
    form: ubiquitous
    then: "navigation.css SHALL be the authoritative stylesheet for shared navigation rail, list, row, icon, label, meta, and actions anatomy"
    verify_method: "import-order and selector-ownership assertions in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-003
    form: ubiquitous
    then: "each shared navigation row SHALL use a 32px minimum row height"
    verify_method: "static CSS contract in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-004
    form: ubiquitous
    then: "each standard shared navigation row SHALL use 0 10px padding"
    verify_method: "static CSS contract in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-005
    form: ubiquitous
    then: "each standard shared navigation row SHALL use an 8px anatomy gap"
    verify_method: "static CSS contract in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-006
    form: ubiquitous
    then: "each standard shared navigation row SHALL use the existing 6px small-radius token"
    verify_method: "static CSS contract in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-007
    form: ubiquitous
    then: "each standard shared navigation row SHALL use the existing 13px by 18px footnote typography tokens"
    verify_method: "static CSS contract in src/__tests__/notes_visual_system.test.ts"
  - id: AC-NAV-008
    form: state-driven
    given: "a shared page-navigation row exposes aria-current=\"page\""
    then: "the row SHALL show the shared selected wash and ink marker"
    verify_method: "selector contract plus browser comparison across Main, Settings, Notes collections, and Tasks"
  - id: AC-NAV-009
    form: state-driven
    given: "a shared tree item exposes aria-selected=\"true\""
    then: "its child navigation row SHALL show the shared selected wash and ink marker"
    verify_method: "selector contract plus Notes folder selection browser check"
  - id: AC-NAV-010
    form: ubiquitous
    then: "inactive page-navigation rows SHALL omit aria-current rather than expose aria-current=\"false\" or aria-current=\"true\""
    verify_method: "jsdom assertions in settings_controller.test.ts, notes_controller.test.ts, and lists_controller.test.ts"
  - id: AC-NAV-011
    form: ubiquitous
    then: "Main navigation links SHALL use the shared navigation rail, list, row, icon, label, and meta classes"
