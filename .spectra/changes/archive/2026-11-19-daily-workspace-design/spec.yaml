change_id: daily-workspace-design
title: Daily workspace design
maker: vivi
checker: vigil
acceptance:
  - id: DW-1
    requirement: "When the user navigates among Today, Notes, Tasks, Calendar, Settings, and Notifications, the application shall present the shared type hierarchy, adaptive surfaces, control geometry, and selected navigation state."
  - id: DW-2
    requirement: "When the user selects a note in the desktop library at the standard text scale at 1100px or wider, the application shall show the requested live document beside the library through the existing save and conflict guards, with a Hide/Show control that preserves the same editor and a path back to the library. At accessibility text scale, it shall use the single-pane library-to-document presentation."
  - id: DW-3
    requirement: "When the user opens a note through Find or a linked object while library filtering is active, the application shall show that requested note and retain a usable path back to the library."
  - id: DW-4
    requirement: "When the user edits, reads, switches, or creates a task from a selected passage, the application shall preserve persistence, conflict recovery, editor selection and undo behavior according to the existing operation contracts."
  - id: DW-5
    requirement: "When the user adds or completes a task, changes list or board view, or opens scheduling, the application shall preserve those operations within the redesigned task workspace."
  - id: DW-6
    requirement: "When the user navigates month, week, or day, opens an event, or schedules a task, the application shall show the correct dates, event identity, times, and reviewed duration within the redesigned calendar."
  - id: DW-7
    requirement: "When the viewport narrows or text size increases, the application shall reflow its content and expose reachable navigation and actions without page-level horizontal overflow or clipped essential controls."
  - id: DW-8
    requirement: "When the user uses dark appearance, keyboard navigation, reduced motion, or higher contrast, the application shall retain readable content, visible focus, and truthful interaction feedback."
  - id: DW-9
    requirement: "When the complete meeting-note-to-task-to-calendar flow is exercised, the application shall save the linked work and return the user to the correct source objects through the redesigned UI."
