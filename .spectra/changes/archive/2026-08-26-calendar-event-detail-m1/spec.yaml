intent_class: CHANGE

intent: >-
  Deliver a tranquil, core-authoritative Event detail; an explicit Time block
  lifecycle; safe return to a flexible agenda; recoverable create/remove
  operations; bounded Calendar/Event localization; and mechanically enforced
  Jin-local privacy for Google mirrors.

locked_terms:
  display_kind: Time block
  source_jin: "Source: Jin"
  source_google: "Source: Google"

decisions:
  - id: D-01
    decision: Event detail uses EventDetailCapabilitiesDto with a shared pure core policy predicate.
  - id: D-02
    decision: agenda_bucket is explicit Task metadata and a narrow ADR-0001 exception.
  - id: D-03
    decision: Flexible query requires agenda_bucket=flexible plus canonical status todo or doing and otherwise fails closed.
  - id: D-04
    decision: Create-Time-block and remove/return share recoverable application-observable atomicity.
  - id: D-05
    decision: Operations stage durable before/post images and hashes under a per-vault lock and recover before reads.
  - id: D-06
    decision: Known hashes map before to roll-forward and post to rollback; unknown divergence becomes a blocked conflict.
  - id: D-07
    decision: Index refresh and provider sync enqueue occur only after canonical convergence.
  - id: D-08
    decision: Calendar/Event locale registry initially contains en and pt-BR plus System Default and validated override.
  - id: D-09
    decision: Google outbound mapping is an explicit allowlist for provider-safe Event fields.
  - id: D-10
    decision: M2 starts with an original_start value-type and TZID losslessness audit.

constraints:
  - Preserve AC-001 through AC-033 byte-for-meaning from the frozen RAMZA plan.
  - Keep recurring Events view-only in M1.
  - Google-authoritative Events remain non-mutable in Jin.
  - Removing a Time block never completes, cancels, deletes, moves, or rewrites originating Task content.
  - Unknown canonical hashes are never overwritten by recovery.
  - Canonical convergence precedes index refresh, sync enqueue, notifications, and GUI success.
  - Lifecycle status remains proposed during this authoring step.

