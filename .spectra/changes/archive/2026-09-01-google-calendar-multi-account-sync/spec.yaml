version: 1.1.0
created_at: 2026-08-26
change_id: google-calendar-multi-account-sync
esl_tier: full
maker: vivi
checker: vigil
spec_ref: .spectra/changes/google-calendar-multi-account-sync/spec.md
plan_ref: .spectra/plans/google-calendar-multi-account-sync.md
intent_class: CHANGE

intent: >-
  Provide bidirectional, account-isolated Google Calendar synchronization in
  Jin with account aliases, discover-all calendar controls, routed Jin events,
  editable Google-origin events, audited conflicts, and one unified agenda.

identity:
  jin_account_id: immutable generated GoogleAccountId
  provider_binding: immutable validated (issuer, subject)
  alias: mutable presentation-only account label
  event_target: exact intent-time (provider, account_id, calendar_id)

credential_safety:
  legacy_fallback_after_v2: forbidden
  refresh_lock: account-scoped with auth_generation compare
  reauthentication: provider subject must match
  disconnect: clear scoped cursors and quarantine scoped outbox
  reconnect: explicit review required before quarantined replay

migration:
  activation: journaled transactional-in-effect v1-to-v2 marker
  rerun: idempotent by operation id and phase
  downgrade: >-
    current Jin rejects legacy singleton operations on an activated v2 root;
    already-built historical binaries cannot be retrofitted by current code and
    must not be used to write an activated v2 root

calendar_policy:
  inbound: user enabled/disabled state controls pull and agenda inclusion
  outbound: current provider role independently authorizes mutation
  role_downgrade: quarantine with no silent replay or reroute

sync_keys:
  calendar_sync_primary_key: [provider, account_id, calendar_id]
  event_sync_map_primary_key: [provider, account_id, calendar_id, jin_id, recurrence_key]
  event_sync_map_remote_unique: [provider, account_id, calendar_id, google_event_id, recurrence_key]
  outbox_primary_key: operation_id
  outbox_destination_foreign_key: [provider, account_id, calendar_id]
  outbox_identity: [google_event_id, recurrence_key, jin_id, auth_generation, route_generation]

precedence:
  - Revocation, role downgrade, disconnect, remote cancellation, and local tombstone outrank stale writes.
  - The drain revalidates generations and canonical tombstone state before every provider request.

boundaries:
  recurrence_scopes: [this_occurrence, entire_series]
  deferred_recurrence_scope: this_and_following
  published_destination_move: deferred
  destructive_local_data_removal: separate operation and future spec
  live_smoke: separate non-hermetic attestation; absent result requires live-unvalidated label

stories:
  - { id: S0, title: Freeze baseline and ownership, depends_on: [] }
  - { id: S1, title: Add immutable accounts and routes, depends_on: [S0] }
  - { id: S2, title: Migrate singleton data safely, depends_on: [S1] }
  - { id: S3, title: Namespace OAuth and account lifecycle, depends_on: [S1] }
  - { id: S4, title: Discover calendars and project permissions, depends_on: [S3] }
  - { id: S5, title: Make sync state destination-safe, depends_on: [S1, S2, S4] }
  - { id: S6, title: Centralize mutation and routed outbox writes, depends_on: [S4, S5] }
  - { id: S7, title: Edit Google-origin events safely, depends_on: [S6] }
  - { id: S8, title: Orchestrate isolated aggregate sync, depends_on: [S3, S5, S6, S7] }
  - { id: S9, title: Extend DTO Tauri CLI and GUI, depends_on: [S8] }
  - { id: S10, title: Verify isolation and provider fidelity, depends_on: [S0, S1, S2, S3, S4, S5, S6, S7, S8, S9] }

execution_barriers:
  - A accounts/migration/auth/discovery merges and verifies before B.
  - B composite state/sync safety merges and verifies before C.
  - C mutation/conflict/precedence merges and verifies before D.
  - D client UX integrates only against verified C.

acceptance_criteria:
  - id: AC-GCAL-001
    form: ubiquitous
    given: "the archived rescue is the implementation baseline"
    when: "the integration regression gate runs"
    then: "the archived rescue acceptance checks SHALL remain passing"
    verify_method: "test: rerun AC-CAL-01 through AC-CAL-04"
  - id: AC-GCAL-002
    form: event-driven
    given: "a valid singleton Google configuration"
    when: "migration first commits"
    then: "Jin SHALL persist exactly one immutable account ID for the legacy connection"
    verify_method: "test: config_migration::singleton_creates_one_account"
  - id: AC-GCAL-003
    form: event-driven
    given: "the singleton migration has completed"
    when: "migration runs again"
    then: "Jin SHALL produce no duplicate account, token, mapping, or event rewrite"
    verify_method: "test: config_migration::rerun_is_idempotent"
  - id: AC-GCAL-004
    form: unwanted-behavior
    given: "a legacy token cannot be copied and verified"
    when: "migration attempts account activation"
    then: "Jin SHALL retain the legacy token slot and fail without partial activation"
    verify_method: "test: config_migration::token_copy_failure_rolls_back"
  - id: AC-GCAL-005
    form: event-driven
    given: "a configured account has tokens, mappings, cursors, and event targets"
    when: "its alias is renamed"
    then: "every immutable identity and storage key SHALL remain byte-for-byte unchanged"
    verify_method: "test: account_registry::rename_is_presentation_only"
  - id: AC-GCAL-006
    form: ubiquitous
    given: "OAuth token material is persisted"
    when: "a token storage address is resolved"
    then: "every OAuth token SHALL be addressed by immutable account ID rather than alias or email"
    verify_method: "test: google::secrets::account_namespaces"
  - id: AC-GCAL-007
    form: unwanted-behavior
    given: "OAuth is pending for account A"
    when: "a callback carries state bound to account B"
    then: "Jin SHALL reject the callback without persisting token material"
    verify_method: "test: google::auth::account_state_mismatch"
  - id: AC-GCAL-008
    form: event-driven
    given: "a migrated token lacks CalendarList scope"
    when: "scope compatibility is evaluated"
    then: "Jin SHALL preserve local data and mark only its account `needs_reauth`"
    verify_method: "test: config_migration::scope_upgrade_preserves_data"
  - id: AC-GCAL-009
    form: event-driven
    given: "Google returns visible calendars for a connected account"
    when: "discovery completes"
    then: "Jin SHALL persist every returned calendar under that account ID"
    verify_method: "test: google::calendar_list::persists_all_visible"
  - id: AC-GCAL-010
    form: state-driven
    given: "a calendar is discovered for the first time"
    when: "its registry state is first persisted"
    then: "its enabled state SHALL default to true"
    verify_method: "test: calendar_registry::new_calendar_enabled"
  - id: AC-GCAL-011
    form: event-driven
    given: "a disabled existing calendar and a newly visible calendar"
    when: "discovery refreshes"
    then: "Jin SHALL preserve the existing disable while enabling the new calendar"
    verify_method: "test: calendar_registry::refresh_preserves_choice"
  - id: AC-GCAL-012
    form: event-driven
    given: "a known calendar is absent from a later discovery response"
    when: "reconciliation completes"
    then: "Jin SHALL mark it unavailable without deleting cached canonical events"
    verify_method: "test: calendar_registry::missing_calendar_is_nondestructive"
  - id: AC-GCAL-013
    form: state-driven
    given: "an enabled reader or freeBusyReader calendar"
    when: "agenda and destination capabilities are projected"
    then: "Jin SHALL mirror its events while excluding it from mutation destinations"
    verify_method: "test: calendar_capability::readonly_mirrors_not_destinations"
  - id: AC-GCAL-014
    form: event-driven
    given: "a calendar with queued writes loses writer/owner access"
    when: "discovery refreshes its role"
    then: "Jin SHALL pause those writes with `provider_permission_changed` without rerouting"
    verify_method: "test: calendar_capability::role_downgrade_pauses_exact_route"
  - id: AC-GCAL-015
    form: state-driven
    given: "a calendar is disabled or unavailable"
    when: "aggregate sync schedules destination work"
    then: "sync SHALL issue no provider request for that destination"
    verify_method: "test: sync_orchestrator::inactive_calendar_no_network"
  - id: AC-GCAL-016
    form: state-driven
    given: "two accounts expose identical calendar IDs and Google event IDs"
    when: "either remote identity is queried"
    then: "their cursor and mapping rows SHALL remain independently addressable"
    verify_method: "test: sync_state::same_remote_ids_across_accounts"
  - id: AC-GCAL-017
    form: event-driven
    given: "one destination receives HTTP 410"
    when: "full-bootstrap recovery runs"
    then: "clean mappings outside that exact account/calendar SHALL remain unchanged"
    verify_method: "test: sync_state::scoped_410_cleanup"
  - id: AC-GCAL-018
    form: event-driven
    given: "a new or unpublished Jin event and an enabled writable destination"
    when: "canonical creation or assignment commits"
    then: "one outbox operation SHALL reference that exact account/calendar target"
    verify_method: "test: event_mutation::routes_exact_destination"
  - id: AC-GCAL-019
    form: event-driven
    given: "Local only is selected"
    when: "a Jin event is created"
    then: "no provider outbox operation SHALL be created"
    verify_method: "test: event_mutation::local_only_has_no_outbox"
  - id: AC-GCAL-020
    form: event-driven
    given: "any synced event is created, edited, or deleted through CLI or Tauri"
    when: "its canonical mutation commits"
    then: "exactly one recoverable destination-scoped outbox intent SHALL exist"
    verify_method: "test: event_mutation::entrypoint_outbox_parity"
  - id: AC-GCAL-021
    form: event-driven
    given: "a process stops between canonical write and outbox finalization"
    when: "startup recovery runs"
    then: "the canonical revision and its outbox intent SHALL converge idempotently"
    verify_method: "test: event_mutation::journal_failure_injection"
  - id: AC-GCAL-022
    form: state-driven
    given: "a non-cancelled Google event on an enabled available writer/owner calendar"
    when: "core projects mutation capabilities"
    then: "core capability projection SHALL report it editable"
    verify_method: "test: event_capabilities::writable_google_event"
  - id: AC-GCAL-023
    form: event-driven
    given: "an eligible Google-origin event"
    when: "supported fields are edited in Jin"
    then: "its sparse PATCH intent SHALL preserve target, remote identity, and base etag"
    verify_method: "test: google_sync::google_origin_sparse_patch"
  - id: AC-GCAL-024
    form: event-driven
    given: "an eligible Google-origin event"
    when: "deletion synchronizes successfully"
    then: "Google SHALL receive the delete on the event's persisted destination"
    verify_method: "test: google_sync::google_origin_delete_route"
  - id: AC-GCAL-025
    form: event-driven
    given: "a recurring Google event"
    when: "`This occurrence` is edited"
    then: "Jin SHALL preserve exception and original-start identity through round-trip"
    verify_method: "test: google_sync::recurring_occurrence_identity"
  - id: AC-GCAL-026
    form: event-driven
    given: "a recurring Google event"
    when: "`Entire series` is edited"
