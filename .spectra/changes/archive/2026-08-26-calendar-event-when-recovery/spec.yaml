eidolon: ramza
kind: spec
version: 1.0.0
created_at: 2026-08-26
change_id: calendar-event-when-recovery
esl_tier: full
status: deliberated
maker: Vivi
checker: VIGIL
spec_ref: .spectra/changes/calendar-event-when-recovery/spec.md
change_ref: .spectra/changes/calendar-event-when-recovery/change.json
deliberation_ref: .spectra/changes/calendar-event-when-recovery/deliberation-forge.md
intent_class: CHANGE

intent: >-
  Replace Add Event's native date input with Jin's shared Calendar in range
  mode and restore a synchronized, localized relative date/time input while
  preserving task single-mode, M2 editing, and chronological projections.

diagnosis:
  current_add_event: native input[type=date] with one-day-only controller state
  shared_calendar: committed and used by task due-date flows in single mode
  stranded_reference: dirty primary contains an uncommitted English-only prototype
  recovery_policy: port bounded seams only; never copy older controller mutation/grid behavior wholesale

decisions:
  - id: D-01
    decision: One controller-owned When draft synchronizes natural text, embedded Calendar range, summary, all-day, and times.
  - id: D-02
    decision: First Calendar activation is a valid one-day range, second extends, third restarts; Create requires no redundant range commit.
  - id: D-03
    decision: Extend generic Calendar with range selection/events while preserving exact single-mode contracts.
  - id: D-04
    decision: Range uses APG keyboard navigation, accurate ARIA multiselect state, one roving tabindex, and non-color-only cues.
  - id: D-05
    decision: Natural parsing is pure, bounded, deterministic, and explicitly localized for en and pt-BR.
  - id: D-06
    decision: Date-only input preserves all-day/timed intent; date+time switches to timed and defaults to one hour with midnight rollover.
  - id: D-07
    decision: Human date ranges are inclusive; all-day canonical ends are exclusive and timed ranges use endpoint wall times.
  - id: D-08
    decision: Add Event remains Jin create-only; M2 remains the sole detail-resident edit path and all source authority stays unchanged.
  - id: D-09
    decision: Generic Calendar accepts an explicit locale without importing Event code; Add Event uses the resolved Event locale.
  - id: D-10
    decision: Dialog reset, focus, pending/error retention, responsive scrolling, and no native picker define the calm modal boundary.

decision_gates:
  - id: DG-01
    owner: FORGE
    status: resolved
    question: Confirm live Calendar selection as the Add Event draft while retaining generic calendar:commit without making it mandatory.
    verdict: Add Event consumes synchronous calendar:change only; calendar:commit is an opt-in generic affordance, and setSelection is silent.
    invariants:
      - first-click start=end range is valid even when complete is false
      - Add Event renders no generic commit control
      - month and year navigation emit no selection event
      - single mode emits only the established calendar:selected contract
  - id: DG-02
    owner: FORGE
    status: resolved
    question: Confirm explicit Calendar locale input with system fallback as the generic/event ownership boundary.
    verdict: The Event host resolves locale and owns prose; parser and generic Calendar receive locale explicitly, parser returns error codes, and Calendar imports no Event code.
    invariants:
      - Add Event passes one effective locale to parser formatter and Calendar
      - generic Calendar date labels use explicit locale and supplied chrome labels
      - omitted locale preserves template copy and a connect-time supported system fallback
      - live locale changes preserve text selection times and cached valid parse data

scope:
  in:
    - Add Event shared Calendar range input
    - en and pt-BR relative date/time parser
    - synchronized compound When draft and range summary
    - one-day and multi-day all-day/timed creation
    - shared Calendar range accessibility and localization
    - task single-mode, M1/M2, chronology, browser, and native regression QA
  out:
    - M2 editor input replacement
    - Capture Event compound input
    - non-contiguous multi-select
    - recurrence, attendees, reminders, timezone selector
    - grid click/drag creation
    - Month time-label and Notes FTS recovery

stories:
  - { id: S1, title: Freeze shared Calendar range contract, timebox: 2d, risk: P0, depends_on: [] }
  - { id: S2, title: Add localized natural date/time parsing, timebox: 2d, risk: P0, depends_on: [] }
  - { id: S3, title: Build compound Add Event When surface, timebox: 3d, risk: P0, depends_on: [S1, S2] }
  - { id: S4, title: Serialize all-day and timed ranges safely, timebox: 2d, risk: P0, depends_on: [S3] }
  - { id: S5, title: Preserve calendar architecture boundaries, timebox: 2d, risk: P0, depends_on: [S1, S3, S4] }
  - { id: S6, title: Complete browser and native acceptance, timebox: 2d, risk: P1, depends_on: [S1, S2, S3, S4, S5] }

acceptance_criteria:
  - { id: AC-001, given: Calendar Add Event is open, when: When renders, then: it SHALL use Jin's shared Calendar and contain no native date input/picker, verify_method: DOM plus native screenshot }
  - { id: AC-002, given: fresh Add Event, when: opened, then: "it SHALL initialize selected Day or today as all-day with hidden 09:00-10:00 defaults and title focus", verify_method: controller GUI test }
  - { id: AC-003, given: empty range, when: one enabled day activates, then: it SHALL become a valid one-day range, verify_method: Calendar controller test }
  - { id: AC-004, given: one-day range, when: second date activates, then: endpoints SHALL normalize and inclusive days SHALL expose range state, verify_method: transform/controller matrix }
  - { id: AC-005, given: completed range, when: third date activates, then: a new valid one-day range SHALL start, verify_method: controller test }
  - { id: AC-006, given: month/year-crossing range, when: pointer or keyboard selects, then: endpoints/interior SHALL remain correct, verify_method: unit plus Playwright }
  - { id: AC-007, given: range mode, when: rendered/changed, then: ARIA multiselect selection endpoint/interior non-color cues one roving tabindex and localized labels SHALL be accurate, verify_method: DOM accessibility assertions }
  - { id: AC-008, given: Calendar keyboard focus, when: APG keys activate, then: navigation SHALL hold and focus SHALL remain usable to complete range, verify_method: keyboard matrix plus Playwright }
  - { id: AC-009, given: task due Calendar single mode, when: existing flows run, then: selection clear today bounds keyboard normalization and payloads SHALL remain unchanged, verify_method: existing suites plus smoke }
  - { id: AC-010, given: en locale, when: supported/invalid expressions parse, then: deterministic results/localized errors SHALL match the grammar, verify_method: pure parser table }
  - { id: AC-011, given: pt-BR locale, when: supported accent variants/times and invalid expressions parse, then: deterministic results/localized errors SHALL match the grammar, verify_method: pure parser table }
  - { id: AC-012, given: fixed input today locale, when: system timezone/locale changes, then: parser output SHALL not change, verify_method: deterministic fixtures }
  - { id: AC-013, given: relative text, when: preview changes, then: localized preview/error SHALL update and invalid input SHALL not mutate valid draft, verify_method: controller plus Playwright }
  - { id: AC-014, given: valid relative text, when: Enter/Use applies, then: Calendar and summary SHALL sync and optional time SHALL make a one-hour timed draft including midnight rollover, verify_method: controller matrix }
  - { id: AC-015, given: date-only text, when: applied, then: current all-day/timed state and times SHALL be preserved, verify_method: controller tests }
  - { id: AC-016, given: any date input method, when: it changes, then: draft visible range and summary SHALL agree without mandatory extra commit, verify_method: sync tests plus Playwright }
  - { id: AC-017, given: one all-day date, when: created, then: start SHALL be that date and end SHALL be next date, verify_method: command assertion }
  - { id: AC-018, given: inclusive multi-day all-day range, when: created, then: end SHALL be day after last visible date, verify_method: boundary matrix }
  - { id: AC-019, given: timed one/multi-day range, when: created, then: endpoint wall datetimes and chronology validation SHALL be exact, verify_method: serialization matrix }
  - { id: AC-020, given: invalid/missing fields, when: Create runs, then: localized error SHALL appear no command SHALL run and draft SHALL remain, verify_method: controller tests }
  - { id: AC-021, given: pending/failing/successful Create, when: retried/completed, then: one command draft retention or one reload-close-reset SHALL occur as appropriate, verify_method: async tests }
  - { id: AC-022, given: created Event variants, when: Calendar reloads, then: Month and chronological Day/Week projection SHALL remain half-open and correct, verify_method: suites plus smoke }
  - { id: AC-023, given: M1/M2/source/Time block paths, when: exercised, then: authority conflict focus scroll detail editing and no grid-local mutation SHALL remain unchanged, verify_method: suites plus Playwright }
  - { id: AC-024, given: en/pt-BR or live locale switch, when: When rerenders, then: all visible/accessibility copy SHALL localize without losing draft, verify_method: locale DOM plus Playwright }
  - { id: AC-025, given: supported widths themes zoom reduced motion, when: Add Event is used, then: controls/actions SHALL remain readable/reachable with no clipped popup/document overflow, verify_method: visual QA plus native sign-off }
  - { id: AC-026, given: complete GUI/build verification, when: VIGIL checks, then: tests build CSS lint diff and block-mode ESL SHALL pass, verify_method: verification commands }

