{
  "change_id": "development-build-storage",
  "summary": "Portable disk guard for development verification",
  "acceptance_checks": [
    {
      "id": "AC-STORAGE-01",
      "given": "a build command and resolved output volumes",
      "when": "available space is below reserve plus budget",
      "then": "the runner SHALL refuse before spawning the child and report the shortfall",
      "verify_method": "unit tests with a deliberately oversized budget"
    },
    {
      "id": "AC-STORAGE-02",
      "given": "a child command that succeeds or fails",
      "when": "the guarded run completes",
      "then": "the runner SHALL record before, sampled minimum and after free bytes, effective settings and child status, and propagate failure",
      "verify_method": "unit tests and CLI subprocess smoke"
    },
    {
      "id": "AC-STORAGE-03",
      "given": "routine verification without explicit Cargo profile overrides",
      "when": "the child is spawned",
      "then": "the runner SHALL disable incremental compilation and dev/test debug symbols while preserving caller overrides and full-debug mode",
      "verify_method": "unit tests with captured child environment"
    },
    {
      "id": "AC-STORAGE-04",
      "given": "a cleanup request",
      "when": "the target is outside the checkout, has a separate build directory, contains tracked files or links, or a guarded build holds the lock",
      "then": "the runner SHALL refuse destructive cleanup and preserve the candidate",
      "verify_method": "temporary-repository safety tests"
    },
    {
      "id": "AC-STORAGE-05",
      "given": "a checkout-owned Cargo target for one selected Jin package in the dev profile",
      "when": "the user previews then explicitly applies that scope",
      "then": "the runner SHALL preview and apply through native Cargo clean, coordinate access through Cargo locking and report the result",
      "verify_method": "temporary-repository cleanup tests"
    },
    {
      "id": "AC-STORAGE-06",
      "given": "existing CI core, GUI and Windows verification gates",
      "when": "a build or test command runs",
      "then": "the workflow SHALL retain its checks, use guarded builds and upload storage reports even on failure",
      "verify_method": "workflow review and Python test matrix on Ubuntu, macOS and Windows"
    },
    {
      "id": "AC-STORAGE-07",
      "given": "a contributor or agent following the development-storage skill",
      "when": "the task needs verification or disk recovery",
      "then": "the skill SHALL select scoped checks, explain budget tuning and debugger tradeoffs, and require explicit cleanup scope",
      "verify_method": "skill validator and documented command smoke checks"
    }
  ]
}
