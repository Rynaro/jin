    - "Link branch (livePreview.ts:145-192) — per-node handling NOT in HIDE_MARK_NODES (precedent for a new dedicated 'QuoteMark' branch)"
    - "ListMark widget branch (livePreview.ts:197-228) — another non-HIDE per-node branch"
    - "activeLines per-line reveal set (livePreview.ts:124-132)"
    - "atomicDecorationsOf projection (livePreview.ts:264-276) — keeps replace/widget, DROPS spec.class && !spec.widget"
    - "jinLivePreview() provide returns atomicRanges from atomicDecorationsOf(decorations) (livePreview.ts:310-313)"
    - "glyph/label CSS lives in jinEditorTheme in editor.ts (editor.ts:159-181), NOT in livePreview.ts"
    - "tags.quote highlight ALREADY styles quoted TEXT italic + var(--label-secondary) (editor.ts:104) → .cm-blockquote-line needs only the BAR + indent, NOT text color"
    - "reading-view blockquote bar precedent: browse.css:516-521 border-left:3px solid var(--separator); padding-left:var(--space-2); color:var(--label-secondary) — mirror for visual parity"
    - "toolbar quote button inserts '> ' via toggleLinePrefix (editor.ts:407 + :612) → live-preview must render the bar on toolbar-inserted quotes; do NOT break G-TOOLBAR-quote"
  test_file: "jin-gui/src/__tests__/livePreview.test.ts — pure-builder gates via forceParse(state)=ensureSyntaxTree + collectRanges/collectDecos/collectWidgets helpers"
