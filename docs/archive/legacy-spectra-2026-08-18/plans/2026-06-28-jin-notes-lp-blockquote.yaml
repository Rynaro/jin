  with_inline_markup: "'> **bold**' => Blockquote[0,10) QuoteMark[0,1) Paragraph StrongEmphasis EmphasisMark[2,4] EmphasisMark[8,10]. QuoteMark is the LEADING token; inner marks come AFTER it in document order."
