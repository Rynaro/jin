  lazy_continuation: "'> line one\\nlazy line' => ONE Blockquote[0,20), ONLY ONE QuoteMark[0,1); the 2nd (lazy) line has NO QuoteMark → gets NO bar in v1 (documented limitation)."
  blockquote_with_list: "'> - item' => Blockquote[0,8) QuoteMark[0,1) BulletList ListItem ListMark[2,3) Paragraph[4,8). QuoteMark@0 then ListMark@2 → ascending; bar + hidden '>' + bullet glyph, no throw."
  verified_build_ranges:
    - "doc 'x\\n> quoted text' cursor@0 => lineDeco@(2,2) cm-blockquote-line + replace[2,4) ('> ' incl trailing space)"
    - "doc 'x\\n> quoted text' cursor@4 (caret ON quote line) => lineDeco@(2,2) STILL present; replace[2,4) ABSENT (marker revealed, bar persists)"
    - "doc '> a\\n> b\\nplain' cursor@8 (line 3) => lineDeco@(0,0) + replace[0,2) AND lineDeco@(4,4) + replace[4,6)"
    - "doc 'x\\n> **bold**' cursor@0 => lineDeco@(2,2) + replace[2,4) + replace[4,6) + replace[10,12); strictly ascending, no throw"
