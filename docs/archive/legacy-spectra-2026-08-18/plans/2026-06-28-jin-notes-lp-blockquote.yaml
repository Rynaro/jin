# ─────────────────────────────────────────────────────────────────────────────
# TECHNICAL RISK (the brief flagged it #1): RangeSetBuilder ordering of a line decoration
# vs inline replace/mark at the SAME from. RESOLVED EMPIRICALLY (node v24.18.0):
rangesetbuilder_proof:
  startsides: "Decoration.line startSide=-200000000 ; Decoration.replace startSide=499999999 ; Decoration.mark startSide=500000000. RangeSetBuilder orders by (from, then startSide)."
  must_add_line_first: "line@0 THEN replace[0,2) => OK. replace[0,2) THEN line@0 => THROW 'Ranges must be added sorted by from position and startSide'. Same for mark."
  realistic_line: "add line@(2,2) THEN replace[2,4) THEN mark/replace[4,8) => OK (the exact blockquote-with-inline-markup shape)."
  nested_dup_ok: "line@0 THEN line@0 (duplicate) does NOT throw — but the line-start guard makes dedup unnecessary."
  conclusion: >
    Emit the line decoration at the line's from FIRST, inside the QuoteMark branch, BEFORE the
    QuoteMark replace. Because QuoteMark is the LEADING token of its line (verified) and the line
    decoration's startSide (-2e8) sorts before inline replace/mark (~5e8) at the same from, the
    single shared RangeSetBuilder stays monotonic with ZERO collect-and-sort and ZERO second builder.

# CM6 plugin-decoration constraint (the 2nd risk): RESOLVED by reading the installed source.
cm6_plugin_constraint:
  source: "node_modules/@codemirror/view/dist/index.js:2737-2739 + facet doc :8834-8838"
  rule: "Plugin-provided (function-form) decoration sets MAY NOT contain block widgets, NOR replacing decorations that cover a line break. They MAY contain LINE decorations."
  compliance: "jinLivePreview provides decorations via a function (livePreview.ts:309). We add NO block widgets; the QuoteMark replace eats at most ONE space (never '\\n'), so it never covers a line break. Line decorations are explicitly permitted (same class as the stock highlightActiveLine extension)."

# ─────────────────────────────────────────────────────────────────────────────
decisions:
  D-QUOTE-ORDER:
    pick: "Emit Decoration.line at line.from FIRST (inside the QuoteMark branch), THEN the QuoteMark replace — single shared RangeSetBuilder, no collect-and-sort, no second builder."
    rationale: >
      Of the three options the brief listed (emit-line-first / collect+sort / second builder merged
      via Decoration.set), emit-line-first is correct AND cheapest because (a) QuoteMark is the
      leading token of its line (lezer-verified), so nothing on that line has a smaller from, and
      (b) line startSide (-2e8) < replace/mark startSide (~5e8), so line-then-replace at the same
      from is the REQUIRED order and is accepted (empirically proven; the reverse THROWS). Inner
      inline marks on the same line (e.g. EmphasisMark) are visited AFTER QuoteMark in document
      order and have from >= QuoteMark.from, so they append in ascending order automatically.
  D-QUOTE-BAR-ACTIVE:
    pick: "The bar (line decoration) PERSISTS on the active line; only the > marker toggles (revealed raw)."
    rationale: >
      (1) Editing stability — the quote block keeps its visual identity while you type, matching
      Obsidian/Apple Notes. (2) The line decoration is independent of the marker replace; decoupling
      them is natural. (3) It avoids a layout jump: the bar's inline padding/indent would otherwise
      collapse the moment the caret enters the line. Implementation: emit the line decoration
      UNCONDITIONALLY (subject only to the line-start guard); gate ONLY the replace on
      !activeLines.has(lineNo).
  D-QUOTE-LINE-START-GUARD:
    pick: "Emit the line decoration ONLY when node.from === state.doc.lineAt(node.from).from (the QuoteMark is the first char of the line ⇒ top-level blockquote line)."
    rationale: >
      This single guard does three jobs: (a) exactly one bar per top-level blockquote line; (b) it
      naturally dedups nested '>>' (the inner QuoteMark is NOT at line.from → no second bar); (c) it
      PREVENTS a RangeSetBuilder throw for list-wrapped quotes '- > q' (QuoteMark not at line.from →
      no line deco is added mid-line after the bullet replace, which would otherwise DECREASE
      startSide at the same from and throw). The replace (hide '>') is still emitted for ALL
      off-active QuoteMarks regardless of the guard.
  D-QUOTE-NESTED:
    pick: "v1 = SINGLE bar for any depth. '>> nested' → one line decoration (outer mark only, via the line-start guard); ALL '>' markers on the line are hidden off-active (multiple replace ranges)."
    rationale: "Don't over-engineer multi-level bars. Deeper nesting (indented per-level bars) is a documented limitation / future increment. Verified no-throw."
  D-QUOTE-TRAILING-SPACE:
    pick: "QuoteMark replace = [node.from, markTo) where markTo = node.to + (sliceString(node.to, node.to+1)===' ' ? 1 : 0). Eat ONE trailing space only; never '\\n'."
    rationale: >
      QuoteMark is just '>' (lezer-verified); the space belongs to the Paragraph. Eating one space
      makes '> ' fully disappear so the quoted text sits flush against the bar's padding — EXACT
      mirror of the HeaderMark '# ' rule (livePreview.ts:236-240). Conditional eat guarantees the
      replace never crosses a line break (CM6 plugin constraint) for empty '>' / '>>' cases.
  D-QUOTE-ATOMIC:
    pick: "NO change to atomicDecorationsOf. The line decoration is already correctly EXCLUDED from atomicRanges; the QuoteMark replace remains atomic."
    rationale: >
      VERIFIED firsthand: Decoration.line({class:'cm-blockquote-line'}) has spec.class truthy and
      spec.widget undefined → the existing filter (keep iff !spec.class || spec.widget) DROPS it,
      exactly like the cm-link-label mark. A line decoration must NEVER be atomic (it is not a
      hidden range; making the whole line atomic would break caret motion). The QuoteMark replace
      has no class and no widget → KEPT → atomic (correct: prevents caret-trap inside the hidden '>').
      The atomicDecorationsOf 'drop class-bearing non-widget decos' rule already generalizes to line
      decos — no code change, but a NEW gate (G-LP-QUOTE-ATOMIC) pins this behavior.
  D-QUOTE-STYLE:
    pick: "Bar lives in jinEditorTheme (editor.ts): '.cm-blockquote-line': { borderInlineStart: '3px solid var(--separator)', paddingInlineStart: 'var(--space-2)' }. NO color (tags.quote already styles the text)."
    rationale: >
      Mirrors the reading-view blockquote (browse.css:516-521) for visual parity, using logical
      properties (border-inline-start / padding-inline-start) for RTL safety per the brief. Token
      vars only — never raw hex (G-token-discipline). Text color/italic already handled by the
      tags.quote highlight (editor.ts:104), so .cm-blockquote-line must NOT re-set color (avoids
      double-muting / conflict).
  D-QUOTE-SCOPE:
    pick: "Single-level blockquote bar + > hide/reveal ONLY."
    out: "Multi-level nested bars (one bar only); lazy-continuation lines (no bar on the continuation line); list-wrapped quotes (degrade: no bar, no throw); reading-view blockquote (untouched — separate sanitized path, G-READING-VIEW)."
  D-BUILDER-SHAPE: >
    New dedicated 'QuoteMark' branch in buildLivePreviewDecorations (sibling of the Link/ListMark/HIDE
    branches). QuoteMark is NOT added to HIDE_MARK_NODES (size stays 4 — mirrors the Link/ListMark
    precedent). Reason it cannot reuse the HIDE branch: it needs the EXTRA line decoration + the
    line-start guard + bar-persists-on-active-line semantics that the HIDE branch does not have.

# ─────────────────────────────────────────────────────────────────────────────
