  quotemark_node: "QuoteMark token is EXACTLY the '>' char — it does NOT include the trailing space. ('> quoted text' => QuoteMark[2,3)='>' ; the space at 3 belongs to the inner Paragraph.)"
  quotemark_no_space: "'>quoted' (no space) => QuoteMark[2,3)='>' (still just the '>'). So the trailing-space eat must be CONDITIONAL — eat one space only when sliceString(markTo,markTo+1)===' ' (mirrors HeaderMark, never eats '\\n')."
