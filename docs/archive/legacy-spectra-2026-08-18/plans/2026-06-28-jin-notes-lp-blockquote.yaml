# ─────────────────────────────────────────────────────────────────────────────
objective: >
  In the CM6 live-preview editor, every line of a single-level markdown blockquote (> quoted
  text) renders Obsidian/Apple-style: a vertical bar on the left edge (a Decoration.line with
  class cm-blockquote-line → CSS border-inline-start + inline padding) and the leading >
  marker hidden via Decoration.replace({}) (the > plus ONE trailing space) on every line the
  caret does NOT touch. On the active line the existing per-line reveal shows the raw >, while
  the BAR PERSISTS (only the marker toggles). Pure builder extension of
  buildLivePreviewDecorations; CM6/lezer ONLY; no innerHTML; no markdown-it/dompurify.

# ─────────────────────────────────────────────────────────────────────────────
foundation:
  builder: "jin-gui/src/lib/notes/livePreview.ts — buildLivePreviewDecorations(state, ranges?) (pure)"
  established_patterns:
