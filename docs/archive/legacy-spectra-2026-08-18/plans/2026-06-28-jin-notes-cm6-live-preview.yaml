  - id: LP-4
    title: Caret + robustness hardening (top-risk story) + owner visual checklist
    user_story: "As a note editor, I want the caret to behave correctly across hide/reveal transitions and never throw on partial/empty markdown, verified by adversarial tests and an owner visual pass."
    timebox: "<=1d"
    risk: P1
    depends_on: [LP-3]
    action_plan:
      - State-level adversarial tests: unterminated **, inline code mid-edit, heading being typed (# then space), empty doc, doc with only markers, multi-line selection spanning heading+bold+code.
      - State-level caret test: reveal-on-selectionSet (move caret onto a hidden-marker line -> that line's markers leave the set).
      - Author the owner cargo-tauri-dev visual checklist (markers visually hidden off-line; revealed on-line; arrow-key caret skips hidden markers without stutter; selection across lines reveals all).
    given_when_then:
