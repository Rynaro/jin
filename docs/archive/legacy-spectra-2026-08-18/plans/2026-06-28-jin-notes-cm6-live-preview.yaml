# ─────────────────────────────────────────────────────────────────────────────
# VALIDATION GATES (must exist AND bite — anti-shallow)
# ─────────────────────────────────────────────────────────────────────────────
validation_gates:
  # New LP gates
  G-LP-HIDE:       "doc=heading+bold, cursor on a DIFFERENT line -> buildLivePreviewDecorations produces replace decorations over the #/** marker ranges (assert exact from/to)."
  G-LP-REVEAL:     "cursor ON the heading/bold line -> those marker ranges are NOT in the set (revealed for editing)."
  G-LP-ATOMIC:     "the plugin contributes atomicRanges that exactly cover the hidden marker ranges (assert provided via EditorView.atomicRanges)."
  G-LP-SELECTION:  "a selection spanning lines 1..3 reveals every marker on lines 1,2,3."
  G-LP-CARET-MOVE: "selectionSet onto a previously-hidden marker line removes that line's markers from the set (reveal-on-move)."
  G-LP-REBUILD:    "decorations rebuild on docChanged/viewportChanged/selectionSet (assert set changes after a selection-only transaction)."
  G-LP-ROBUST:     "unterminated **, lone backtick, '# ' mid-type, empty doc -> valid DecorationSet, never throws; degrade to raw."
  G-LP-NO-INNERHTML: "every produced decoration is Decoration.replace with NO widget (no decoration injects note text as HTML)."
  G-LP-SMOKE:      "mountEditor with live-preview does not throw; .cm-content present; handle.getDoc() === initial doc (buffer unchanged)."
  # Preserved immovable gates (must stay green)
  preserved:
    G-XSS:            "notes_controller.test.ts:505 — <script> body -> literal text, not executed. Unaffected (CM6 renders text; LP uses replace, never innerHTML)."
    G-CHOKEPOINT:     "markdown.test.ts:366-405 — only markdown.ts imports markdown-it/dompurify. livePreview.ts must stay clean."
    G-SAVE-CARET-SAFE: "selection-only transaction does NOT call onSave and does NOT change getDoc() (LP touches decorations, never the buffer or pendingSave)."
    G-KEYMAP:         "editor.test.ts:392 — Tab/Enter/Mod+B/Mod+I/Mod+K/Mod+1..6 still fire (operate on doc; atomicRanges only affects caret motion)."
    G-TOOLBAR-*:      "Bold/H2/List toolbar clicks still mutate the doc."
    G-FOOTER-STATS:   "word/char/read-time still update on docChanged."
    G-READING-VIEW:   "Reading-view toggle still renders via renderMarkdownFragment (chokepoint)."

# ─────────────────────────────────────────────────────────────────────────────
# RISKS (caret/atomicRanges = top)
# ─────────────────────────────────────────────────────────────────────────────
risks:
  - id: R-CARET
    severity: P0
    desc: >
      Revealed<->hidden transitions when the caret moves onto/off a styled span; atomicRanges
      correctness (no trap, no N-key stutter over a hidden marker). Mitigated by per-line reveal
      (the line you're on is always raw) + atomicRanges == the same replace set (active-line
      markers are absent -> never atomic). One-frame ordering: the move uses pre-move atomicRanges,
      then selectionSet reveals the landed line — no trap because the target line becomes raw.
    verify: G-LP-CARET-MOVE (state) + owner cargo-tauri-dev arrow-key pass.
  - id: R-PERF
    severity: P1
    desc: "Rebuild cost. Mitigated: rebuild only on docChanged||viewportChanged||selectionSet; iterate only view.visibleRanges."
  - id: R-PARTIAL
    severity: P1
    desc: "Unterminated/mid-edit markdown. Mitigated: only marks under a completed parent node are hidden; never throw; degrade to raw. G-LP-ROBUST."
  - id: R-HEADLESS-PARSE
    severity: P2
    desc: "syntaxTree(state) may be incomplete in headless tests. Mitigated: ensureSyntaxTree(state, doc.length) before asserting (K-LP-4)."
  - id: R-HEADER-SPACE
    severity: P2
    desc: "HeaderMark covers only '#'s; the separating space is a gap. Mitigated: extend replace by one trailing space (K-LP-3) for flush-left heading text."

# ─────────────────────────────────────────────────────────────────────────────
# REJECTED ALTERNATIVES (prevent re-exploration)
# ─────────────────────────────────────────────────────────────────────────────
rejected_alternatives:
  H2-class-encapsulated: "Build decorations entirely inside the ViewPlugin class (no free function). Rejected: couples tests to a mounted view (jsdom geometry caveats) and weakens the anti-shallow state-level range assertions D-TEST requires."
  H3-statefield: "Build the DecorationSet in a StateField. Rejected: a StateField cannot see viewportChanged/visibleRanges (view-only) -> must decorate the whole doc (perf regression on large notes). H1 keeps the pure-function testability of a field PLUS viewport awareness."
  H4-css-hide: "Use mark decorations toggling display:none instead of atomic Decoration.replace. Rejected: the caret can still land inside a display:none span (trap/stutter) and selection geometry is off; atomic replace is the correct primitive."
  npm-live-preview-pkg: "Adopt a community live-preview package. Rejected (D-DEP): incomplete/unmaintained, widens dependency + audit surface for ~150 LOC we control."

confidence:
  overall: 0.90
  factors:
    pattern_match: 0.85       # extends a just-shipped module with a well-known CM6 pattern
    requirement_clarity: 0.95 # owner locked architecture, scope, gates
    decomposition_stability: 0.90  # 4 stories, clean dependency chain
    constraint_compliance: 0.92    # deps/node-names/chokepoint/gates all verified firsthand
  decision: AUTO_PROCEED

execution_sequence: [LP-1, LP-2, LP-3, LP-4]
