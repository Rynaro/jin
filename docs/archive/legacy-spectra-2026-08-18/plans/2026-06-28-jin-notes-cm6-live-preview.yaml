# STORIES (ordered; INVEST; GIVEN/WHEN/THEN)
# ─────────────────────────────────────────────────────────────────────────────
stories:
  - id: LP-1
    title: Pure decoration core — syntax-tree walk + per-line reveal (the brain)
    user_story: "As a note editor, I want markdown markers replaced/hidden on inactive lines and revealed on the active line so editing feels like Obsidian Live Preview while raw markdown stays the source of truth."
    timebox: "<=2d"
    risk: P0
    depends_on: []
    action_plan:
      - Create jin-gui/src/lib/notes/livePreview.ts (imports only @codemirror/* per module_contract).
      - Implement buildLivePreviewDecorations(state, ranges?) per build_algorithm (HeaderMark/EmphasisMark/StrikethroughMark/CodeMark; per-line reveal over all selection.ranges; HeaderMark +1 trailing space).
      - Use Decoration.replace({}) only (NO widget). Degrade to raw (no decoration) for partial/unterminated constructs (parser yields no parent node -> no mark).
    given_when_then:
      - "GIVEN '# Title\\n\\n**bold** text' WHEN cursor is on line 1 (offset 0) THEN buildLivePreviewDecorations hides the **bold** EmphasisMark ranges (line 3) but reveals the line-1 HeaderMark (active line)."
      - "GIVEN the same doc WHEN cursor is on the **bold** line THEN both EmphasisMark ranges on that line are revealed (NOT in the set) and the line-1 HeaderMark IS hidden (replace over [0,2) incl. the trailing space)."
      - "GIVEN '`code`' with cursor on a DIFFERENT line THEN both CodeMark ranges are hidden and CodeText is NOT decorated (stays styled monospace)."
      - "GIVEN unterminated '**bold' (no closing) THEN no StrongEmphasis node exists -> no EmphasisMark hidden -> raw shown; the call does not throw."
    gates: [G-LP-HIDE, G-LP-REVEAL, G-LP-NO-INNERHTML]
    agent_hints:
      class: Builder (Vivi)
      context_files: [jin-gui/src/lib/notes/editor.ts, jin-gui/src/lib/notes/markdown.ts, jin-gui/src/__tests__/editor.test.ts]
      notes: "Node>=20 (nvm v24.18.0; system node v16 crashes vitest). Use ensureSyntaxTree(state, doc.length) in tests to force parse before asserting ranges (K-LP-4)."

  - id: LP-2
    title: ViewPlugin wrapper — viewport-aware rebuild + atomicRanges provide
    user_story: "As a note editor, I want decorations rebuilt only when needed and only over visible text, with hidden markers skipped by the caret as one unit, so editing is fast and the cursor never gets trapped."
    timebox: "<=1d"
    risk: P0
    depends_on: [LP-1]
    action_plan:
      - Export jinLivePreview(): Extension as a ViewPlugin.fromClass per module_contract.
      - Rebuild decorations on update.docChanged || update.viewportChanged || update.selectionSet.
      - Iterate only view.visibleRanges (perf). Provide EditorView.atomicRanges via `provide` over the SAME decoration set.
    given_when_then:
      - "GIVEN a mounted editor with jinLivePreview WHEN the plugin is queried THEN it contributes atomicRanges whose ranges exactly equal the hidden-marker DecorationSet (G-LP-ATOMIC)."
      - "GIVEN the cursor moves from line 1 to the bold line (selection-only transaction) WHEN selectionSet fires THEN decorations rebuild: the bold line's markers become revealed and line 1's HeaderMark becomes hidden."
      - "GIVEN a doc edit WHEN docChanged fires THEN decorations rebuild from the new tree."
    gates: [G-LP-ATOMIC, G-LP-REBUILD]
    agent_hints:
      class: Builder (Vivi)
      context_files: [jin-gui/src/lib/notes/livePreview.ts, jin-gui/src/__tests__/editor.test.ts]
      notes: "atomicRanges = view.plugin(plugin)?.decorations ?? Decoration.none — single source of truth; do NOT build a separate atomic set."

  - id: LP-3
    title: Compose into editor.ts via livePreviewCompartment (default-on) — preserve all gates
    user_story: "As the Jin app, I want live-preview to be the default edit mode without changing the on-disk format, the save flow, the keymap, the toolbar, the footer, or the Reading view."
    timebox: "<=1d"
    risk: P0
    depends_on: [LP-2]
    action_plan:
      - Add livePreviewCompartment + import jinLivePreview in editor.ts (see integration anchors).
      - Add livePreviewCompartment.of(jinLivePreview()) to the extensions array after the highlight compartment.
      - Run full jin-gui vitest suite; confirm every preserved gate stays green.
    given_when_then:
      - "GIVEN mountEditor with live-preview WHEN the editor mounts THEN it does not throw, .cm-content exists, and handle.getDoc() === the initial doc (decorations never mutate the buffer) (G-LP-SMOKE)."
      - "GIVEN a selection-only transaction (caret move, no doc change) WHEN dispatched THEN onSave is NOT called and getDoc() is unchanged (G-SAVE-CARET-SAFE)."
      - "GIVEN the existing suite WHEN run THEN G-XSS, G-CHOKEPOINT, G-KEYMAP*, G-TOOLBAR-*, G-FOOTER-STATS, G-READING-VIEW all stay green."
    gates: [G-LP-SMOKE, G-SAVE-CARET-SAFE, G-XSS, G-CHOKEPOINT, G-KEYMAP, G-TOOLBAR-BOLD, G-TOOLBAR-H2, G-TOOLBAR-LIST, G-FOOTER-STATS, G-READING-VIEW]
    agent_hints:
      class: Builder (Vivi)
      context_files: [jin-gui/src/lib/notes/editor.ts, jin-gui/src/__tests__/editor.test.ts, jin-gui/src/__tests__/notes_controller.test.ts, jin-gui/src/__tests__/markdown.test.ts]
