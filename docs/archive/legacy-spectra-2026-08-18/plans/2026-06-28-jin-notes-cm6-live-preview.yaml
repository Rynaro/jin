# SPECTRA agent handoff — Jin Notes CM6 inline Live-Preview (Obsidian "Live Preview")
# Methodology: SPECTRA 4.10.0  |  envelope_version: 2.0  |  ECL: present (.eidolons/spectra/ECL_VERSION)
meta:
  spec_id: 2026-06-28-jin-notes-cm6-live-preview
  title: Inline live-preview (hide/reveal markdown markers) for the Jin CM6 note editor
  intent_type: CHANGE            # extends the just-shipped CM6 source editor
  from: spectra
  to: vivi                       # apivr / Builder capability class
  performative: PROPOSE
  repo: jin-gui                  # FRONTEND-ONLY
  date: 2026-06-28
  conventions_file: null         # .spectra/setup/spectra-conventions.md absent -> generic defaults
  complexity: 9/12               # raw; architecture+scope LOCKED by owner -> single-pass extended tier (NOT TRANCE)
  routing: extended-single-pass
  confidence: 0.90               # AUTO_PROCEED (>=85%)

builds_on:
  - jin-gui/src/lib/notes/editor.ts        # CM6 editor; Compartments staged for this exact layer
  - jin-gui/src/lib/notes/markdown.ts      # sanitize chokepoint (renderMarkdownFragment) — Reading view only
  - prior: cfc941a (CM6 source editor), 2167269 (Apple-Notes chrome)

# ─────────────────────────────────────────────────────────────────────────────
# LOCKED SCOPE (owner directive)
# ─────────────────────────────────────────────────────────────────────────────
scope:
  goal: >
    While editing, render markdown STYLED INLINE with syntax markers HIDDEN, EXCEPT on the
    line(s) the cursor/selection touches, where raw markdown is REVEALED for editing. Pure
    CM6 decoration layer over the same text buffer. Raw markdown stays the on-disk source of
    truth. Live-preview becomes the DEFAULT edit mode.
  in_scope:
    - Hide/reveal markers for HEADINGS (# .. ######) via HeaderMark (+ one trailing space).
    - Hide/reveal INLINE EMPHASIS markers — bold **/__ and italic */_ (EmphasisMark),
      strikethrough ~~ (StrikethroughMark), inline code ` (CodeMark).
    - Reveal raw on the ACTIVE line(s) — every line any selection range touches.
    - Provide EditorView.atomicRanges over the hidden marker ranges (caret skips them as one unit).
    - Keep existing jinHighlightStyle (styles TEXT) — live-preview only hides MARKERS; they compose.
    - Keep the existing Reading-view toggle (full rendered HTML via renderMarkdownFragment) AS-IS.
  out_of_scope_deferred:   # state explicitly as follow-ups; do NOT build now (each is Widget/Replace-heavy)
    - List bullet/number glyph rendering
    - Checkbox widgets
    - Link/url collapse to clickable text
    - Image embeds
    - Blockquote vertical bar
    - Horizontal-rule widget
    - Tables, code-block backgrounds
    - Setext (=== / ---) headings (same HeaderMark mechanism; trivial follow-up)
    - Always-raw "source mode" toggle (livePreviewCompartment makes this a 1-line follow-up)

# ─────────────────────────────────────────────────────────────────────────────
# DECISIONS
# ─────────────────────────────────────────────────────────────────────────────
decisions:
  D-DEP:
    decision: HAND-ROLL the ViewPlugin. Do NOT add a live-preview npm package.
    rationale: >
      All required primitives are present in installed deps (verified firsthand):
      syntaxTree (@codemirror/language ^6.12.4), atomicRanges Facet + skipAtomicRanges
      (@codemirror/view ^6.43.4), Decoration.replace/ViewPlugin (@codemirror/view), and the
      lezer-markdown parse tree via @codemirror/lang-markdown ^6.5.0 (markdownLanguage =
      commonmark.configure([GFM,...]) so Strikethrough nodes ARE produced). Community
      live-preview packages are incomplete/unmaintained and would widen the dependency
      surface (and the chokepoint/audit burden) for ~150 LOC we fully control and can test.
    verified_node_names: [ATXHeading1-6, HeaderMark, Emphasis, StrongEmphasis, EmphasisMark, Strikethrough, StrikethroughMark, InlineCode, CodeMark, CodeText]
  D-REVEAL:
    decision: PER-LINE reveal (not per-element).
    rule: >
      A syntax marker is HIDDEN iff NO selection range touches the line that contains it.
      Equivalently: activeLines = union over state.selection.ranges of
      [doc.lineAt(r.from).number .. doc.lineAt(r.to).number]; a marker on an active line is
      revealed, every other marker is hidden.
    rationale: >
      Simplest correct rule and matches Obsidian closely (the whole active line goes raw).
      For ALL v1 elements (headings, emphasis, strike, inline code) the element never spans a
      line break, so per-line == per-element on the marker's own line, BUT per-line also
      reveals the OTHER markers on the active line — the desired "edit this line raw" feel.
      Multi-line selection naturally reveals every intersected line (G-LP-SELECTION).
    use_all_ranges: true   # iterate state.selection.ranges, not just .main (multi-cursor correctness)
  D-MODULE:
    decision: New module jin-gui/src/lib/notes/livePreview.ts exporting buildLivePreviewDecorations + jinLivePreview. editor.ts imports it. Keeps editor.ts cohesive.
  D-COMPARTMENT:
    decision: Add a NEW dedicated `livePreviewCompartment` in editor.ts (default-on), rather than folding into highlightCompartment.
    rationale: >
      Cohesion (highlight != conceal) and it makes the deferred source-mode toggle a 1-line
      reconfigure. "Compose via Compartment(s) so it can be reconfigured/toggled" — owner intent.
  D-TEST:
    decision: >
      Assert behavior at the STATE level via the pure function buildLivePreviewDecorations(state, ranges)
      — iterate the returned DecorationSet and assert exact hidden ranges (from/to) given a doc +
      selection. Plus ONE real-mount smoke test (plugin loads, no throw, buffer unchanged). The
      DECORATIONS' visual effect (markers actually hidden on screen) is OWNER-verified via
      `cargo tauri dev` — jsdom lacks the layout CM6 decoration geometry needs.
    headless_parse_note: >
      syntaxTree(state) is viewport/parse-driven; in headless tests call
      ensureSyntaxTree(state, state.doc.length, <ms>) (from @codemirror/language) FIRST to force a
      full synchronous parse for small test docs before asserting ranges. Provide a forceParse(state)
      test helper (K-LP-4).
    anti_shallow: >
      NO "plugin is defined" tests. Every LP gate asserts the hide/reveal RANGES for a concrete
      doc + selection, or exercises the real mounted wiring. (Owner mutation-tests the gates.)

# ─────────────────────────────────────────────────────────────────────────────
# MODULE CONTRACT (for Vivi — shape, not implementation)
# ─────────────────────────────────────────────────────────────────────────────
module_contract:
  file: jin-gui/src/lib/notes/livePreview.ts
  imports_allowed: ["@codemirror/state", "@codemirror/view", "@codemirror/language", "@lezer/common (optional)"]
  imports_forbidden: ["markdown-it", "dompurify"]   # G-CHOKEPOINT scanner — keep clean
  exports:
    - "const HIDE_MARK_NODES = new Set(['HeaderMark','EmphasisMark','StrikethroughMark','CodeMark'])"
    - "buildLivePreviewDecorations(state: EditorState, ranges?: readonly {from:number;to:number}[]): DecorationSet"
    - "jinLivePreview(): Extension"
  build_algorithm: |
    activeLines := union over state.selection.ranges of [lineAt(r.from).number .. lineAt(r.to).number]
    ranges := ranges ?? [{from:0, to:state.doc.length}]
    for each r in ranges:
      syntaxTree(state).iterate({ from:r.from, to:r.to, enter(node):
        if HIDE_MARK_NODES.has(node.name):
          lineNo := state.doc.lineAt(node.from).number
          if not activeLines.has(lineNo):
            to := node.to
            if node.name=='HeaderMark' and state.doc.sliceString(to,to+1)==' ': to += 1   # K-LP-3 (Obsidian flush-left)
            add Decoration.replace({}) over [node.from, to]
      })
    # iterate yields document order -> RangeSetBuilder add() stays sorted-by-from. Never throw.
  viewplugin: |
    jinLivePreview = ViewPlugin.fromClass(class {
      decorations = buildLivePreviewDecorations(view.state, view.visibleRanges)
      update(u): if (u.docChanged || u.viewportChanged || u.selectionSet)
                   decorations = buildLivePreviewDecorations(u.view.state, u.view.visibleRanges)
    }, {
      decorations: v => v.decorations,
      provide: plugin => EditorView.atomicRanges.of(view => view.plugin(plugin)?.decorations ?? Decoration.none)
    })
    # atomicRanges == the SAME replace DecorationSet -> single source of truth; revealed (active-line)
    # markers are absent from the set, so they are never atomic (no caret trap on the line you edit).

