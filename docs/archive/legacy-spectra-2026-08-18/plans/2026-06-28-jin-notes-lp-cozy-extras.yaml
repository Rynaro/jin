# ─────────────────────────────────────────────────────────────────────────────
objective: >
  Add two OPT-IN "cozy writing" modes to the CM6 note editor, each a toolbar icon-toggle (default OFF),
  each driven by its OWN CM6 Compartment so toggling is a view.dispatch(compartment.reconfigure(...))
  with NO remount and NO caret move. (1) FOCUS MODE: when ON, every line the caret/selection does NOT
  touch gets a Decoration.line({class:'cm-dim'}) so it visually recedes; the active line(s) stay full
  opacity. Pure builder buildFocusDecorations(state, ranges?) recomputed on selection/doc change, mirroring
  buildLivePreviewDecorations. (2) TYPEWRITER SCROLLING: when ON, a transaction extender appends an
  EditorView.scrollIntoView(head, {y:'center'}) effect to every transaction that changes a COLLAPSED
  cursor (selectionSet or docChanged) so the active line stays vertically centered; a RANGE selection is
  NOT re-centered (iA-Writer jumpiness caveat). Both modules are chokepoint-clean (only @codemirror/* —
  no markdown-it / dompurify / innerHTML). Neither feature mutates the doc buffer.

# ─────────────────────────────────────────────────────────────────────────────
