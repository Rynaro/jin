risks:
  - id: R1
    p: P1
    risk: "Typewriter centering + focus-dim OPACITY FEEL are not assertable in jsdom (no layout / no real scroll)."
    mitigation: "Test WIRING not pixels: G-TYPEWRITER-WIRING spies EditorView.scrollIntoView (called/​not-called per collapsed/range/off); G-TYPEWRITER-TARGET unit-tests the pure decision; G-FOCUS-DIM asserts exact decoration ranges; G-FOCUS-TOGGLE asserts .cm-dim presence. The visual centering + dim opacity are EXPLICITLY owner-verified via `cargo tauri dev` (call-out in execution_plan)."
  - id: R2
    p: P1
    risk: "Dispatching scrollIntoView from inside a CM6 updateListener is disallowed (warns / can loop)."
    mitigation: "D-TYPEWRITER-MECHANISM uses an EditorState.transactionExtender that APPENDS the scroll effect to the same transaction — no second dispatch. Documented fallback: a listener that DEFERS via queueMicrotask. Either way the scrollIntoView spy gate (G-TYPEWRITER-WIRING) holds."
  - id: R3
    p: P1
    risk: "Re-centering during an active multi-char SELECTION causes view jumpiness (iA-Writer note)."
    mitigation: "typewriterTarget returns null when !collapsed → no effect for range selections. Gated by AC-COZY2.2 + AC-COZY2.5 (range case must NOT call scrollIntoView)."
  - id: R4
    p: P2
    risk: "New toolbar toggles disturb the existing toolbar layout / break G-TOOLBAR-STRUCTURE."
    mitigation: "We ADD two .cm-toolbar__btn toggles in the right cluster (after the spacer, before Read) and RENAME nothing; G-TOOLBAR-STRUCTURE asserts the existing set by aria-label/class and stays green. The spacer (flex:1) still pushes the whole right cluster right."
  - id: R5
    p: P2
    risk: "cm-dim opacity also dims the active line, or stays after toggling off (stuck dim)."
    mitigation: "Builder NEVER emits on an active line (AC-COZY1.1); toggling OFF reconfigures to [] → plugin gone → all decorations dropped (AC-COZY1.4 second click)."
  - id: R6
    p: P2
    risk: "Bottom 50vh padding leaves permanent dead space, or the rule loses the specificity fight with the base .cm-content padding."
    mitigation: "D-TYPEWRITER-PADDING keys on '.cm-content.cm-typewriter' (specificity beats base .cm-content) and the class is present ONLY when ON (contentAttributes in the ON compartment) → no dead space off, padding reliably applied on. Gated by G-TYPEWRITER-PADDING (class-present DOM smoke)."
  - id: R7
    p: P2
    risk: "Toggle state confusion across note switches (resets to OFF on remount)."
    mitigation: "D-PERSIST documents v1 = per-mount default OFF; this is intended scope. Cross-note/persisted is a one-line documented follow-up (module singletons / settings)."
  - id: R8
    p: P3
    risk: "Spying on the static EditorView.scrollIntoView and then applying the real effect could be flaky in jsdom."
    mitigation: "Prefer vi.spyOn(EditorView,'scrollIntoView') KEEPING the original (records args + returns the real effect). If applying the real scroll effect throws in jsdom, stub it to return a harmless no-op StateEffect (StateEffect.define). Either path satisfies G-TYPEWRITER-WIRING (assert call args)."

