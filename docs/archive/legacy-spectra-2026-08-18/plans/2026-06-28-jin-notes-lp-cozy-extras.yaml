# ─────────────────────────────────────────────────────────────────────────────
# FIRSTHAND CM6 facts (verified from the installed @codemirror/* + the working tree)
cm6_facts:
  multiple_decoration_providers: >
    Focus mode is a SEPARATE ViewPlugin from livePreview with its OWN decorations facet. CM6 merges
    DecorationSets from all extensions; a single line can carry BOTH cm-blockquote-line (livePreview) AND
    cm-dim (focusMode) — the classes compose. There is NO shared RangeSetBuilder between the two plugins,
    so the #3 blockquote ordering hazard does NOT recur across modules.
  line_decoration_from_plugin: >
    Plugin-provided (function-form) decoration sets MAY contain LINE decorations (verified for #3:
    @codemirror/view index.js:2737-2739 + :8834-8838 forbid only BLOCK widgets and replacing decorations
    that cross a line break). cm-dim is a zero-width Decoration.line at line.from → always legal.
  rangesetbuilder_line_order: >
    A RangeSetBuilder requires strictly non-decreasing (from, startSide). Iterating lines in ascending
    number and adding Decoration.line at each line.from yields ascending from with equal startSide (-2e8)
    → monotonic, no throw. (focus mode adds ONLY line decos, all at line.from, so ordering is trivially safe.)
  scrollintoview_is_a_state_effect: >
    EditorView.scrollIntoView(pos, opts) returns a StateEffect (created from a StateEffectType). It MAY be
    added to a transaction's effects at STATE level (e.g. from a transactionExtender) — the view reads it
    afterwards to scroll. This is why the transactionExtender mechanism (D-TYPEWRITER-MECHANISM) needs no
    second dispatch and is caret-safe (it is an effect, not a doc/selection change).
  transaction_extender_inputs: >
    In EditorState.transactionExtender.of(tr => ...): tr.docChanged (bool), tr.selection (the explicitly
    set selection or undefined — typing maps the cursor automatically so tr.selection can be undefined on a
    doc change), tr.newSelection.main.empty (collapsed?), tr.newSelection.main.head (post-tr caret). The
    reconfigure transaction that toggles a compartment has docChanged=false AND selection=undefined → the
    extender returns null → NO scroll on toggle (verified shape).
  compartment_reconfigure_caret_safe: >
    view.dispatch({effects: cmp.reconfigure(ext)}) carries NO doc change and NO selection → the EditorView
    instance is the SAME node and state.selection.main.head is unchanged. This is the basis for G-TOGGLE-CARET-SAFE.
  lucide_icons_present: "Verified in installed lucide@0.523.0: Focus, Crosshair, AlignCenterVertical, TextCursor, TextCursorInput, AlignVerticalSpaceAround all export. Chosen: Focus (focus mode), AlignCenterVertical (typewriter)."

# ─────────────────────────────────────────────────────────────────────────────
# Canonical builder ranges (offsets computed firsthand for the focus-mode gates)
focus_builder_facts:
  doc_three_lines: "doc 'line1\\nline2\\nline3' => line1[0,5) '\\n'@5 ; line2[6,11) '\\n'@11 ; line3[12,17). line1.from=0, line2.from=6, line3.from=12"
  cursor_line2: "cursor@8 (inside line2) => activeLines={2}; buildFocusDecorations returns EXACTLY [ line@(0,0) cm-dim, line@(12,12) cm-dim ] — NO deco at from=6 (active line2)"
  selection_lines_1_2: "selection anchor=0 head=8 (spans line1..line2) => activeLines={1,2}; returns EXACTLY [ line@(12,12) cm-dim ] (only line3 dimmed)"
  single_line_doc: "doc 'solo' cursor@0 => activeLines={1}; line count 1 => returns EMPTY set (the only line is active → nothing to dim)"
  off_state: "focus OFF => focusCompartment.of([]) → no ViewPlugin → ZERO cm-dim decorations in the DOM (asserted at the toggle/integration level, not in the pure builder)"

# ─────────────────────────────────────────────────────────────────────────────
decisions:
  D-MODULE:
    pick: "TWO new sibling modules: jin-gui/src/lib/notes/focusMode.ts (focus) + jin-gui/src/lib/notes/typewriter.ts (typewriter). NOT livePreview.ts; NOT inlined into editor.ts."
    rationale: >
      (1) editor.ts is already ~723 lines and cohesive (surface + toolbar + debounce + reading view); adding
      two more behaviors inline would bloat it. (2) livePreview.ts is the marker-hide chokepoint layer; focus
      dimming is a different concern (whole-line opacity, not marker hiding) and typewriter is not a decoration
      at all. (3) Two small one-purpose modules mirror the existing one-concept-per-file style (markdown.ts,
      blocks.ts, transform.ts, livePreview.ts) and let the two stories ship as INDEPENDENT units with no shared
      new file. Each module imports ONLY @codemirror/* → chokepoint-clean by construction (G-CHOKEPOINT-COZY).
    out: "A single combined 'cozyExtras.ts' (rejected — bundles two unrelated concerns and forces both stories to share a file)."
  D-GRANULARITY:
    pick: "ACTIVE-LINE granularity for focus mode v1 (dim every line NOT in the activeLines set). Paragraph granularity DEFERRED."
    rationale: >
      (1) Reuses the EXACT activeLines computation already proven in livePreview.ts:124-132 — zero new traversal
      logic, one pass O(visible lines). (2) Visual COHERENCE with live preview: the line you are editing is both
      marker-REVEALED (livePreview) AND un-dimmed (focus) because both layers key off the SAME active-line set;
      paragraph granularity would desync the two (a dimmed-but-revealed line, or an undimmed-but-hidden line).
      (3) Paragraph focus needs blank-line boundary scanning + special-casing fenced code blocks / list items
      that span a 'paragraph', which conflicts with the per-LINE reveal and adds edge cases. Line is the
      pragmatic, cheaper, coherent v1. TRADE-OFF: prose writers may prefer paragraph/sentence focus (iA Writer);
      that is a documented follow-up increment, not v1.
  D-FOCUS-BUILDER:
    pick: "buildFocusDecorations(state, ranges = [{from:0,to:state.doc.length}]): DecorationSet — PURE, returns Decoration.line({class:'cm-dim'}) at line.from for every line in `ranges` whose number is NOT in activeLines."
    rationale: >
      Mirrors buildLivePreviewDecorations(state, ranges?) so gates assert exact dim-line ranges HEADLESSLY (no
      layout needed — line numbers + offsets only, NO syntaxTree). The ViewPlugin jinFocusMode() calls it over
      view.visibleRanges (perf) and rebuilds on docChanged|selectionSet|viewportChanged — the EXACT
      jinLivePreview() skeleton. Adds line decos in ascending line order → RangeSetBuilder-safe (cm6_facts).
  D-TOGGLE:
    pick: "Two .cm-toolbar__btn icon-toggles, RIGHT-aligned (inserted AFTER toolbarSpacer, BEFORE the Read toggle), DEFAULT OFF, each with aria-pressed reflecting state. Icons: Focus (focus mode), AlignCenterVertical (typewriter)."
    placement_rationale: >
      The Read toggle already lives in the right cluster after the spacer (editor.ts:447-448) — focus + typewriter
      are MODE toggles of the same family (change how the surface behaves, not the text), so grouping them with
      Read on the right is the most discoverable + consistent spot. Insert order: [...format buttons...] [spacer]
      [Focus] [Typewriter] [Read]. ADD a mkSep() before the group if visual separation is wanted. We ADD, never
      rename → G-TOOLBAR-STRUCTURE (asserts the existing 12 buttons + .cm-toolbar__toggle by aria-label/class)
      stays green; the spacer still pushes the whole right cluster right.
    default_rationale: >
      DEFAULT OFF because always-on dimming/centering surprises a first-time writer (every comparable app — iA
      Writer, Typora, Obsidian — ships both as opt-in toggles, default off). Default-off ALSO guarantees zero
      behavior change to the existing default editor + every existing gate.
    aria: "aria-pressed='false' initially → 'true' when active (single source of truth, styled via [aria-pressed='true']); aria-label 'Focus mode' / 'Typewriter scrolling'. Use mkBtn then add aria-pressed in the toggle handler."
  D-COMPARTMENT:
    pick: "TWO new Compartments — focusCompartment + typewriterCompartment — added beside the existing five (editor.ts:526-530), each .of([]) initially (OFF). Toggle = view.dispatch({effects: cmp.reconfigure(ON ? <ext> : [])})."
    contents:
      focus_on: "focusCompartment.reconfigure(jinFocusMode())  // ON"
      focus_off: "focusCompartment.reconfigure([])             // OFF"
      typewriter_on: "typewriterCompartment.reconfigure([ typewriterExtender(), EditorView.contentAttributes.of({ class: 'cm-typewriter' }) ])  // ON: behavior + bottom-padding class"
      typewriter_off: "typewriterCompartment.reconfigure([])   // OFF"
    composition: >
      Each compartment is independent. focusCompartment's ViewPlugin and livePreviewCompartment's ViewPlugin BOTH
      provide decorations; CM6 merges them (cm6_facts.multiple_decoration_providers) — no ordering coupling, no
      shared builder. typewriterCompartment holds a transactionExtender (state facet) + a contentAttributes class
      — orthogonal to all decoration compartments. Confirmed composes with highlight/language/keymap/theme/livePreview.
    rationale: "Reconfigure = no remount, caret-safe (cm6_facts.compartment_reconfigure_caret_safe). Exact precedent: livePreviewCompartment (editor.ts:530, :569)."
  D-TYPEWRITER-MECHANISM:
    pick: "EditorState.transactionExtender (PRIMARY) that appends EditorView.scrollIntoView(head,{y:'center'}) to any transaction with a COLLAPSED post-selection that changed (docChanged || tr.selection). RANGE selection → no effect."
    rationale: >
      The brief sketched an updateListener that calls view.dispatch(...). CM6 DISALLOWS dispatching a new
      transaction from inside an updateListener (it warns / can loop). The transactionExtender appends the scroll
      effect to the SAME transaction → CM6 scrolls during normal processing → NO second dispatch, NO flicker,
      caret-safe (effect only). It is fully WIRING-testable: spy EditorView.scrollIntoView and assert it is
      called with (head,{y:'center'}) for a collapsed change, NOT called for a range selection, NOT called when
      OFF. The collapsed/range/no-change decision is also factored into a PURE helper typewriterTarget(...) for
      a layout-free unit gate.
    fallback: >
      If the extender proves awkward to compartmentalize, the documented alternative is an updateListener that
      computes the same typewriterTarget and DEFERS the scroll via queueMicrotask(() => view.dispatch({effects:
      EditorView.scrollIntoView(pos,{y:'center'})})) — deferral satisfies the no-dispatch-in-listener rule and
      keeps the same scrollIntoView spy gate. (Effect is BUILT synchronously so the spy still fires for the test.)
    pure_helper: "typewriterTarget({selectionChanged:boolean, collapsed:boolean, head:number}): number|null  — returns head iff (collapsed && selectionChanged) else null. Layout-free, trivially unit-testable."
    enable_polish: >
      OPTIONAL (P2): in the toggle handler, AFTER the ON reconfigure, if the current selection is collapsed,
      dispatch ONE scrollIntoView(head,{y:'center'}) so enabling immediately centers the caret (iA-Writer feel).
      This is a click-handler dispatch (allowed) — not inside a listener. Off-path; owner-verified.
  D-TYPEWRITER-PADDING:
    pick: "Bottom scroll room so the LAST lines can reach center: a jinEditorTheme rule keyed '.cm-content.cm-typewriter' { paddingBottom: '50vh' }, activated ONLY when ON via EditorView.contentAttributes.of({class:'cm-typewriter'}) in the typewriter compartment."
    rationale: >
      Centering the last line needs empty space below it (matches iA Writer/Typora ~50vh). Keying the rule on
      '.cm-content.cm-typewriter' (specificity 0,3,0 once CM6 scopes it) beats the base '.cm-content' padding
      (0,2,0), so it reliably ADDS bottom padding without fighting the existing inset; when OFF the class is
      absent → no extra whitespace (no permanent dead space). Keeps ALL editor CSS in jinEditorTheme (project
      convention; token-free 50vh is a viewport unit, acceptable like the existing 100vh minHeight at :137).
    out: "A permanent large padding-bottom (rejected — adds dead space when typewriter is off)."
  D-PERSIST:
    pick: "v1 = per-MOUNT in-memory, DEFAULT OFF on every mountEditor. NOT persisted to settings; NOT a localStorage round-trip. State held as two `let focusOn=false; let typewriterOn=false;` closures inside mountEditor."
    rationale: >
      Tightest scope — frontend-only, no settings schema / invoke / backend change, and TEST-ISOLATED (no
      module-level mutable state leaking between vitest cases). Persistence forks a real decision (global vs
      per-note scope; settings store vs localStorage) that is a clean follow-up, not part of the last roadmap
      increment. TRADE-OFF: toggles reset to OFF when you switch notes (the controller remounts the editor per
      note). Acceptable for cozy extras. DEFERRED options, one-line each: (a) per-session across notes → hoist
      the two flags to module-level singletons in editor.ts; (b) persisted across restarts → settings/localStorage.
    assumption: "mountEditor is called fresh per note open (controller remount). If instead the editor persists across note switches, per-mount state already 'persists per session' for free — either way default OFF, no gate impact."
  D-FOCUS-CSS:
    pick: ".cm-dim in jinEditorTheme: { opacity: '0.4', transition: 'opacity 120ms var(--ease-standard)' }  (token-driven dim; tune opacity 0.3-0.45 owner-verified)."
    rationale: >
      Per the #3 D-QUOTE-STYLE precedent, editor decoration CSS lives in jinEditorTheme (editor.ts), not
      browse.css. opacity is the simplest dim that keeps text legible-but-recessive; the transition softens the
      shift as the caret moves between lines. Active line has NO class → full opacity. (Alternative 'color:
      var(--label-tertiary)' rejected — opacity dims the WHOLE line incl. glyphs/links uniformly; color-only
      would not dim the cm-link-label accent or bullet glyphs.)
  D-TEST-STRATEGY:
    pick: "Focus = pure-builder gate (exact dim ranges, headless) + toggle gate (real button click reconfigures the compartment → cm-dim appears/disappears) + caret-safe gate. Typewriter = pure typewriterTarget gate + WIRING gate (spy EditorView.scrollIntoView on real-mount: collapsed→called, range→not, off→not) + caret-safe gate. The actual scroll POSITION is NOT asserted (no layout in jsdom) — owner-verifies the visual feel via cargo tauri dev."
    rationale: "Mirrors the LP D-TEST split (pure builder asserted headlessly; one real-mount smoke for wiring). The jsdom-untestable part (pixel centering, dim opacity feel) is explicitly owner-verified — see risks R1."

