# ─────────────────────────────────────────────────────────────────────────────
objective: >
  In the CM6 live-preview editor, an explicit markdown link [label](url) on a NON-active
  line collapses to just the label, styled as a link (accent + underline), with the
  surrounding syntax ([, ](url), closing )) hidden via Decoration.replace({}). On the
  active line the existing per-line reveal shows the raw [label](url) for editing.
  Pure builder extension of buildLivePreviewDecorations; CM6/lezer ONLY; no innerHTML;
  no markdown-it/dompurify in livePreview.ts.

# ─────────────────────────────────────────────────────────────────────────────
foundation:
  builder: "jin-gui/src/lib/notes/livePreview.ts — buildLivePreviewDecorations(state, ranges?) (pure)"
  established_patterns:
    - "HIDE_MARK_NODES branch (livePreview.ts:170-180) — hide marker node ranges on inactive lines"
    - "ListMark widget branch (livePreview.ts:136-166) — per-node handling NOT in HIDE_MARK_NODES (precedent for a new 'Link' branch)"
    - "activeLines per-line reveal (livePreview.ts:116-123)"
    - "atomicRanges provide == decoration set (livePreview.ts:218-222) — single source"
    - "glyph CSS lives in jinEditorTheme in editor.ts (editor.ts:159-173), NOT in livePreview.ts"
  test_file: "jin-gui/src/__tests__/livePreview.test.ts — pure-builder gates via forceParse(state)=ensureSyntaxTree + collectRanges/collectWidgets helpers"
  node_requirement: ">=20 (nvm v24.18.0; system node v16 crashes vitest)"

# ─────────────────────────────────────────────────────────────────────────────
# FIRSTHAND lezer verification (dumped from markdown({base: markdownLanguage}); see notes)
lezer_facts:
  explicit_link: "[label](url) => Link node with children in order: LinkMark '[', URL? no — label is UNTYPED TEXT (NO node), LinkMark ']', LinkMark '(', URL, (LinkTitle?), LinkMark ')'"
  label_is_not_a_node: "CRITICAL — the label has NO syntax node. label range = [firstLinkMark.to, closeBracketLinkMark.from). Must be computed, not read from a child."
  plain_label_children: "[LinkMark, LinkMark, LinkMark, URL, LinkMark]"
  title_link_children: "[LinkMark, LinkMark, LinkMark, URL, LinkTitle, LinkMark] (LinkTitle present, KEEP collapsing — hidden by closing-syntax replace which spans to Link.to)"
  nested_label_children: "[LinkMark, StrongEmphasis|InlineCode|..., LinkMark, LinkMark, URL, LinkMark] (extra inline node => DO NOT collapse, see R2)"
  half_typed_open_paren: "'[label](' => Link [.. ] with only 2 LinkMarks ([ and ]), NO URL => degrade to raw"
  no_url: "'[label]' => Link, 2 LinkMarks, no URL => raw"
  empty: "'[]()' => Link, 4 LinkMarks, NO URL node, empty label => raw"
  nested_brackets: "'[outer [inner] x](u)' => only inner '[inner]' parses as a Link (no URL) => raw; outer is NOT a Link"
  reference: "'[ref][id]' => Link with LinkLabel child, no URL => raw"
  autolink: "'<https://x>' => Autolink node (NOT Link) => untouched"
  bare_url: "'bare https://x here' => standalone URL node, no Link parent => untouched"
  image: "'![alt](u)' => Image node (NOT Link) => untouched"
  verified_collapse_ranges:
    - "doc 'x\\n[label](https://example.com)' cursor@0 => replace[2,3) ('['), mark[3,8) ('label'), replace[8,30) ('](https://example.com)')"
    - "doc 'x\\n[ok](https://x.io) tail' cursor@0 => replace[2,3), mark[3,5), replace[5,20); ' tail' untouched"
    - "doc 'x\\n[a](https://1.io) and [c](https://2.io)' cursor@0 => replace[2,3),mark[3,4),replace[4,19),replace[24,25),mark[25,26),replace[26,41)"
    - "doc 'x\\n[t](javascript:alert(1))' cursor@0 => [] (unsafe scheme => raw)"
    - "doc 'x\\n[**bold** x](https://y.io)' cursor@0 => only inner emphasis replaces [3,5),[9,11); NO link collapse, NO mark (nested-skip)"
    - "doc '[label](https://example.com)' cursor@2 (caret ON link line) => [] (per-line reveal => raw)"

# ─────────────────────────────────────────────────────────────────────────────
decisions:
  D-CLICKABLE:
    pick: "Option A — display-only collapse + link styling; click POSITIONS THE CARET (activates line => existing per-line reveal shows raw for editing). NOT clickable-to-open in this increment."
    rationale: >
      The Jin app has NO Tauri opener/shell plugin. src-tauri/src/lib.rs:23 registers ONLY
      tauri_plugin_dialog; capabilities/default.json grants ONLY ['core:default','dialog:allow-open'].
      There is NO anchor-click / external-open bridge anywhere in jin-gui (grep: zero hits for
      window.open / openUrl / location.href / target=_blank). Even the reading view's sanitized
      <a href> anchors are NOT wired to open externally today — Option B's machinery does not exist.
      Adding clickable-open (Option B) REQUIRES src-tauri changes (Cargo.toml tauri-plugin-opener +
      .plugin(tauri_plugin_opener::init()) in lib.rs + an 'opener:allow-open-url' capability +
      @tauri-apps/plugin-opener npm dep + an opener bridge passed into editor.ts as a callback).
      That breaks the FRONTEND-ONLY constraint and is a materially larger surface. Lower-risk
      shippable option = A. B is split to increment #2.5 with the exact plumbing identified below.
    tradeoff: "Owner asked for 'clickable text'. A delivers the visual link affordance + click-to-edit; it does NOT open the URL. #2.5 adds opening. Accepted: A is consistent with #1's display-only call and respects frontend-only."
    fast_follow_2_5_plumbing:
      npm: "add @tauri-apps/plugin-opener (frontend)"
      cargo: "add tauri-plugin-opener to jin-gui/src-tauri/Cargo.toml"
      register: "jin-gui/src-tauri/src/lib.rs:23 — add .plugin(tauri_plugin_opener::init()) next to tauri_plugin_dialog"
      capability: "jin-gui/src-tauri/capabilities/default.json permissions — add 'opener:allow-open-url'"
      bridge: "pass an onOpenUrl(url) callback into mountEditor opts; livePreview.ts stays PURE — wire a click handler in editor.ts that, on click of a .cm-link-label (or via EditorView.domEventHandlers), reads the URL from the (then-active/raw) Link node OR a data-attr and calls onOpenUrl; controller supplies openUrl from @tauri-apps/plugin-opener."
      security: "reuse SAFE_LINK_SCHEME (http/https/mailto only) at the open seam; G-LP-LINK-OPEN must drive a REAL DOM click and assert (a) opener invoked with the URL for https, (b) opener NOT invoked for javascript:/file:/data:."
  D-LABEL-NODE: "label range = [firstLinkMark.to, closeBracketLinkMark.from) — computed; label is NOT a node."
  D-COLLAPSE-RULE: >
    Collapse a Link node ONLY when ALL hold: (1) has a URL child; (2) >=4 LinkMark children;
    (3) non-empty label (lt > lf); (4) NO nested-markup child — every child name ∈ {LinkMark, URL, LinkTitle};
    (5) URL passes SAFE_LINK_SCHEME; (6) line is NOT active. Else emit nothing for the Link (degrade to raw).
  D-SCHEME: >
    SAFE_LINK_SCHEME = /^(?:https?|mailto):/i — LOCAL const in livePreview.ts, mirroring
    markdown.ts ALLOWED_URI_REGEXP (markdown.ts:42). Deliberate DUPLICATION: do NOT import from
    markdown.ts (it imports markdown-it+dompurify => would taint the chokepoint). Relative/anchor
    links (#x, ./x, /x) are NOT http/mailto => stay RAW in v1 (documented limitation).
  D-NESTED: >
    Labels containing nested markdown (StrongEmphasis/InlineCode/Emphasis/etc.) DO NOT collapse —
    skip the Link. VERIFIED HAZARD: collapsing them throws 'Ranges must be added sorted by from'
    because the closing-syntax replace (high from) is added at Link-enter, then iteration descends
    into the label's inner marks (low from) => out-of-order RangeSetBuilder.add. With the skip, the
    inner EmphasisMark/CodeMark are still hidden by the existing HIDE branch (link syntax shown raw);
    no throw. Detection: any Link child whose name ∉ {LinkMark, URL, LinkTitle}.
  D-ATOMIC: >
    atomicRanges must contain the hidden-syntax REPLACE ranges (caret-trap prevention on zero-width
    hidden content) but MUST EXCLUDE the label MARK (the label is real, editable, clickable text;
    making it atomic would coarsen click-to-position — the whole point of the increment). Implement an
    exported pure projection atomicDecorationsOf(set) that keeps replace/widget decorations and drops
    mark decorations; the plugin 'provide' returns EditorView.atomicRanges.of(view =>
    atomicDecorationsOf(plugin.decorations)). Regression-safe: existing decorations are all
    replace/widget => projection is identity for non-link docs => existing G-LP-ATOMIC gates unchanged.
  D-STYLE: >
    Label styling lives in jinEditorTheme in editor.ts (NOT livePreview.ts):
    '.cm-link-label': { color: 'var(--accent)', textDecoration: 'underline' }. NO cursor:pointer in
    v1 (it is edit-on-click text, not open — pointer would falsely imply opening; #2.5 adds it).
  D-SCOPE: "Explicit [label](url) ONLY. Autolinks <...>, bare linkified URLs, reference [a][id], images ![..](..) are OUT of scope and left untouched (verified they parse as distinct/non-Link nodes)."
  D-BUILDER-SHAPE: "New 'Link' branch in buildLivePreviewDecorations (sibling of the ListMark/HIDE branches). 'Link' is NOT added to HIDE_MARK_NODES (size stays 4 — mirrors ListMark precedent)."

