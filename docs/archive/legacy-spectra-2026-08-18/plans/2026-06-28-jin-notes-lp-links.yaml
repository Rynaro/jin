      - "jin-gui/src/__tests__/livePreview.test.ts (EDIT — NEW describe block only; do NOT touch link-free base tests)"
    action_plan:
      - "Add: const SAFE_LINK_SCHEME = /^(?:https?|mailto):/i  (top of file, with mirror-of-markdown.ts comment)"
      - "In buildLivePreviewDecorations enter(): add an 'if (node.name === Link)' branch BEFORE the HIDE_MARK_NODES branch (sibling of the ListMark branch ~livePreview.ts:136)"
      - "Branch: materialize node.node; iterate children — collect LinkMark[], URL, detect nested (child.name ∉ {LinkMark,URL,LinkTitle}); guard: !url || marks.length<4 || nested => return"
      - "Compute open=marks[0], closeB=marks[1], lf=open.to, lt=closeB.from; guard lt<=lf => return (empty label)"
      - "Guard !SAFE_LINK_SCHEME.test(doc.sliceString(url.from,url.to)) => return"
      - "Per-line reveal: if activeLines.has(doc.lineAt(node.from).number) => return"
      - "Emit IN ORDER: builder.add(node.from, open.to, Decoration.replace({})); builder.add(lf, lt, Decoration.mark({class:'cm-link-label'})); builder.add(closeB.from, node.to, Decoration.replace({}))"
      - "Add exported pure atomicDecorationsOf(set: DecorationSet): DecorationSet — rebuild a RangeSet keeping decorations EXCEPT marks (drop spec.class && !spec.widget); used by provide"
      - "Change provide to: EditorView.atomicRanges.of(view => atomicDecorationsOf(view.plugin(p)?.decorations ?? Decoration.none))"
