    timebox: "0.5d"
    depends_on: ["T3", "T5"]
    action_plan:
      - "Create lib/notes/folderTreePrefs.ts mirroring lib/appearance/state.ts (STORAGE_KEY='jin_notes_folder_tree'; load try/catch->DEFAULTS; save try/catch silent)."
      - "Controller connect(): loadFolderTreePrefs() -> seed expandedFolders Set + paneCollapsed -> apply before first render. toggleFolder + togglePane call saveFolderTreePrefs()."
