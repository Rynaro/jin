scope:
  intent_type: REQUEST
  repo: jin-gui
  frontend_only: true
  base_version: "main = v0.3.0"
  branch: "feat/notes-folder-tree-sidebar off main (cut AFTER the code-highlighting PR lands)"
  one_liner: >
    Replace the FLAT folder rail (render.ts renderFolderRail :70-101) with a nested
    WAI-ARIA tree-view: disclosure chevrons + expand/collapse, per-folder counts,
    selected-row highlight, full keyboard navigation (roving tabindex + Arrow/Home/End),
    and a collapsible sidebar pane. Pure client-side tree built by splitting FolderDto.path
    on '/' — NO backend change. list_folders already returns every ancestor.
  in_scope:
    - "Pure tree builder + flatten-visible (new lib/notes/folderTree.ts)"
    - "Recursive ARIA tree render (role=tree/treeitem/group, aria-level, aria-expanded, aria-selected)"
    - "Disclosure chevrons (rotate on expand) + per-depth indentation + leaf spacer alignment"
    - "Per-folder direct counts (right-aligned, muted, hidden when 0)"
    - "Expand/collapse via TARGETED DOM (no full re-render); expanded Set as state"
    - "Roving tabindex + keyboard nav (Up/Down/Right/Left/Home/End/Enter/Space) per WAI-ARIA APG"
    - "Collapsible sidebar pane (grid rail track -> 0 / restore, with transition + reveal control)"
    - "localStorage persistence of expanded Set + pane-collapsed (mirrors lib/appearance/state.ts)"
    - "Preserve VG-FE (folder click -> listNotes{folder}) + VG-FE-FOLDER-OPEN (returns to list)"
  out_of_scope_this_round:
    - "Folder rename / delete / drag-reparent (need backend; DEFERRED — owner-locked)"
    - "Aggregate (recursive) parent counts (noted as a client roll-up follow-up)"
    - "Resizable rail (drag handle) — widen to a fixed comfortable width instead"
    - "Type-ahead first-letter focus (OPTIONAL delight; stretch sub-task, not a gate)"
  deferred:
    - "Aggregate counts: sum descendant note_count over the flat list, client-side"
    - "Multi-select / context menu (Apple right-click) — future"

