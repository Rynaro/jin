# ── Risk register ───────────────────────────────────────────────────────────────
risks:
  - id: R1-SANITIZER-VS-HIGHLIGHTER
    severity: P0
    desc: "The decisive constraint. A highlighter emitting inline style= (Shiki) goes colorless under FORBID_ATTR:['style']; one emitting real nodes could weaken XSS. hljs CLASS-based output + UNCHANGED DOMPurify + the script-in-fence gate (G-CODE-HLJS-SANITIZE) neutralize this."
    mitigation: "Return hljs INNER spans only; keep DOMPurify config byte-identical; G-CODE-HLJS-SANITIZE bites on any regression."
  - id: R2-BUNDLE-SIZE
    severity: P1
    desc: "highlight.js/lib/common (~37 langs) is EAGERLY bundled into the reading-view path (tens of KB gzip). @codemirror/language-data grammars are LAZY (per-fence chunks) so the editor side is near-free in the main bundle."
    mitigation: "common is the pragmatic default; if size bites later, swap to per-language hljs imports. Note in the PR."
  - id: R3-CLIPBOARD-CAPABILITY
    severity: P1
    desc: "No Tauri clipboard plugin/capability exists; relying on navigator.clipboard.writeText. Could be unavailable in some webview/context."
    mitigation: "try/catch -> aria-live status (no throw). Optional execCommand fallback deferred. No new Rust dep/capability."
  - id: R4-LARGE-BLOCK-PERF
    severity: P1
    desc: "Highlighting a huge fence blocks the render thread."
    mitigation: "MAX_HIGHLIGHT_BYTES=50000 -> plain fallback (G-CODE-LARGE-SKIP)."
  - id: R5-THEME-CONSISTENCY
    severity: P2
    desc: "Editor (lezer tags) and reading view (hljs classes) could drift if mapped to different colors."
    mitigation: "Single shared palette_map -> same var(--*) for both; tokens.css supplies dark variants so one ref set covers both modes."
  - id: R6-ICON-HYDRATION
    severity: P2
    desc: "Lucide <i data-lucide> needs createIcons() on the reading-wrapper subtree; if not hydrated, copy/wrap show no glyph (still functional via aria-label)."
    mitigation: "Hydrate after replaceChildren in the toggle; text-glyph fallback acceptable."
  - id: R7-LANG-GRAMMAR-ASYNC
    severity: P2
    desc: "CM6 grammars lazy-load -> first paint of a fence may be briefly unhighlighted; nested-token tests are async-flaky."
    mitigation: "MUST gate = matchLanguageName resolution (sync); nested tokenization owner-verified. Expected CM6 behavior."

