  - { id: R-ORPHAN-DIR, sev: P0, note: "remove_dir_all guarded by *.md scan; move_note leaves source dir, removal is explicit final guarded step" }
  - { id: R-LINK, sev: P1, note: "reuses move_note (ULID-based); VG bridge gates re-prove backlink survival + empty list_dangling with REAL attach edge" }
  - { id: R-CURRENT-SYNC, sev: P1, note: "D-CURRENT-FOLDER-SYNC remap; VG-CURRENT-SYNC" }
  - { id: R-DND-A11Y, sev: P1, note: "kebab menu is the keyboard-reachable equivalent; no op is drag-exclusive" }
