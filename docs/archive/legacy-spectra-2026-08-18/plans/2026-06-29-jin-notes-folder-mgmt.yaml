      - "VG-CURRENT-SYNC: currentFolder=Work, rename Work->Job -> currentFolder Job + listNotes({folder:Job}); delete Job -> currentFolder '' + reload"
      - "VG-A11Y-KEBAB: kebab is focusable <button>; aria-haspopup=menu; open sets aria-expanded=true; Escape closes; kebab click does NOT fire selectFolder"
      - "MUTATION: unwiring Rename menuitem fails VG-KEBAB-RENAME"
    preserve_gates: [VG-FE, VG-FE-FOLDER-OPEN, VG-FE-TMPL, folderTree-pure, VG-NEW-FOLDER, G-XSS]
    gates: [VG-KEBAB-RENAME, VG-KEBAB-RENAME-NESTED, VG-KEBAB-DELETE, VG-SUBFOLDER, VG-CURRENT-SYNC, VG-A11Y-KEBAB]
    agent_hint: { class: builder, node: ">=20 via nvm", context: "study #jin-new-folder-modal + stubDialogMethods harness" }

