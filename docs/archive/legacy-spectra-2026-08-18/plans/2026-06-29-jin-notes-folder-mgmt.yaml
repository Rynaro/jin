spec_id: 2026-06-29-jin-notes-folder-mgmt
title: "Jin Notes — Folder Management (rename / delete-to-parent / drag-note-into-folder)"
author: spectra
handoff_to: vivi            # apivr / Builder
intent_type: CHANGE
base_branch: main           # v0.5.0; branch off main
complexity: 9
confidence: 0.90
ecl_envelope: false         # no ECL_VERSION in install root

scope:
  in:
    - Backend rename_folder (jin-core) — prefix-rewrite via move_note, recreate empty subdirs, remove old tree
    - Backend delete_folder MOVE-TO-PARENT (jin-core) — flatten subtree notes to parent_of(path), return moved count
    - Tauri commands rename_folder_fn / delete_folder_fn + lib.rs registration + api::refresh
    - invoke.ts renameFolder / deleteFolder bindings
    - Drag note -> folder (frontend, reuses existing moveNote)
    - Per-row kebab menu (Rename / Delete / New Subfolder) via native <dialog>, keyboard reachable
  out:
    - Folder->folder re-nesting via drag (DEFERRED)
    - Merge-on-collision for rename (v1 refuses)
    - contextmenu right-click handler (OPTIONAL alias only)
    - Soft-delete of folders
    - Tasks/Events folders

owner_locked:
  D-DELETE-POLICY: move-to-parent (non-destructive); delete F flattens all notes under F + subfolders to F's parent (top-level parent = root "")
  D-DRAG-SCOPE: NOTE -> FOLDER only (reuses move_note)

decisions:
  D-RENAME-MECHANISM: per-note move_note over a pre-mutation snapshot; dest = new_path + folder[old_path.len()..]
  D-RENAME-COLLISION: refuse if notes_dir.join(new_path) exists; refuse new==old; refuse new starts_with old + "/"
  D-RENAME-EMPTY-SUBDIRS: recreate empty descendant subfolders under new prefix
  D-DELETE-PARENT: parent_of(path) = before last "/" or ""; ALL subtree notes flatten to that single parent
  D-DELETE-COUNT: delete_folder returns usize moved count
  D-AFFORDANCE: focusable kebab <button> aria-haspopup=menu opening role=menu (3 menuitems); contextmenu optional
  D-CURRENT-FOLDER-SYNC: remap currentFolder/expandedFolders/focusedFolderPath after rename/delete then loadFolders + conditional loadList
  D-DRAG-DATA: dataTransfer 'application/x-jin-note-id' (+ text/plain mirror); .folder-row__btn--drop-target highlight; same-folder drop = no-op
  D-NEW-SUBFOLDER-REUSE: reuse New Folder dialog + submitNewFolder with newFolderParent prefix

algorithms:
  parent_of: 'path.rsplit_once(''/'').map(|(p,_)| p).unwrap_or("")'
  rename_folder: |
    reject old_path==""; validate(new_path); reject new_path==""; reject new==old;
    reject new.starts_with(old + "/"); reject notes_dir.join(new_path).exists();
    snapshot notes (id, folder) and subdirs under old subtree BEFORE mutation;
    for each note: move_note(id, new_path + folder[old.len()..]);
    recreate empty subdirs under new prefix;
    GUARD err if any *.md remain under old subtree; remove_dir_all(old)
  delete_folder: |
    reject path==""; validate(path); parent = parent_of(path);
    snapshot ids under subtree (folder==path || startsWith path + "/");
    for each id: move_note(id, parent);
    GUARD err if any *.md remain under path subtree; remove_dir_all(path); return count

stories:
  - id: S1
    name: Backend rename_folder core op + parent_of helper
    timebox: "<=1d"
    risk: P0
    depends_on: []
    files:
      - jin-core/src/ops/notes.rs
      - jin-core/src/store/fs.rs
    acceptance:
      - GIVEN notes in Work and Work/Projects WHEN rename Work->Job THEN files under notes/Job and notes/Job/Projects; notes/Work gone
      - GIVEN empty subdir Work/Empty WHEN rename Work->Job THEN notes/Job/Empty exists
      - GIVEN folder Existing on disk WHEN rename Work->Existing THEN Err (collision); Work untouched
      - GIVEN any WHEN rename ""->X THEN Err (refuse root)
      - GIVEN folder Work WHEN rename Work->Work/Sub THEN Err (own descendant)
      - GIVEN parent_of WHEN "Work","Work/Projects","" THEN "","Work",""
    gates: [VG-RENAME-CORE]
    agent_hint: { class: reasoner, fmt: "cargo fmt before commit" }
  - id: S2
    name: Backend delete_folder (move-to-parent) core op
    timebox: "<=1d"
    risk: P0
    depends_on: [S1]
    files:
      - jin-core/src/ops/notes.rs
    acceptance:
      - GIVEN notes in Work + Work/Projects + 1 root WHEN delete Work THEN all former Work* notes folder_path=="", notes/Work removed, root untouched, return==count
      - GIVEN note in A/B/C WHEN delete A/B THEN note folder_path=="A", notes/A/B removed, notes/A remains
      - GIVEN any WHEN delete "" THEN Err (refuse root)
    gates: [VG-DELETE-CORE]
    agent_hint: { class: reasoner, fmt: "cargo fmt before commit" }
  - id: S3
    name: Tauri commands + invoke bindings + anti-shallow bridge round-trips
    timebox: "<=2d"
    risk: P0
    depends_on: [S1, S2]
    files:
