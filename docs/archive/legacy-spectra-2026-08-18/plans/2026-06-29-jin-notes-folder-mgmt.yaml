      - "controller deleteFolder(path): open #jin-delete-folder-modal 'Move N notes to parentLabel and delete?' (N from cachedTree subtree sum); confirm -> deleteFolder(path) + D-CURRENT-FOLDER-SYNC"
      - "controller newSubfolder(path): set newFolderParent; reuse New Folder dialog; submitNewFolder composes parent+'/'+name"
    test_harness_edits_required:
