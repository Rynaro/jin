      - "renderFolderTree.buildNode: .folder-row__btn dragover preventDefault + add drop-target class; dragleave remove; drop read id + cb.onDropNote(path,id)"
      - "controller onDropNote: if target===current folder no-op else moveNote + loadFolders + loadList"
    acceptance:
