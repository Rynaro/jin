    timebox: "<=2d"
    risk: P1
    depends_on: []
    files:
      - jin-gui/src/lib/notes/render.ts
      - jin-gui/src/controllers/notes_controller.ts
      - jin-gui/index.html
      - jin-gui/src/styles/browse.css
