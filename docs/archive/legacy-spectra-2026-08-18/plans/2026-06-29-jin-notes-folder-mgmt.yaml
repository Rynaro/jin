      - jin-gui/src-tauri/src/lib.rs
      - jin-gui/src/invoke.ts
      - jin-gui/src-tauri/tests/bridge.rs
    actions:
      - "rename_folder_fn(root, old_path, new_path) -> Result<(),JinErrorDto>: notes::rename_folder; api::refresh"
      - "delete_folder_fn(root, path) -> Result<usize,JinErrorDto>: n = notes::delete_folder; api::refresh; Ok(n)"
      - "register commands::folders::rename_folder + delete_folder in invoke_handler! Folders block"
      - "invoke.ts: renameFolder -> invoke('rename_folder',{old_path,new_path}); deleteFolder -> invoke('delete_folder',{path})"
    acceptance:
      - "VG-RENAME-BRIDGE: REAL attach edge B->W1; rename Work->Job + refresh; notes/Job exists, notes/Work gone; list_notes(Job)=W1 folder_path Job; list_notes(Job/Projects)=P1; get_note(W1).backlinks still has B; list_dangling empty; collision Job->Existing Err; rename ''->X Err"
      - "VG-DELETE-BRIDGE: REAL attach edge B->W1; moved=delete_folder Work + refresh; W1+P1 folder_path==''; notes/Work gone; W1 backlink from B; moved==2; list_dangling empty; nested delete A/B -> note folder_path 'A'; delete '' Err"
    gates: [VG-RENAME-BRIDGE, VG-DELETE-BRIDGE]
    agent_hint: { class: reasoner, context: "read bridge.rs vg_move_link_integrity_after_folder_move first", fmt: "cargo fmt before push" }
