      - "VG-KEBAB-RENAME-NESTED: rename leaf Work/Projects -> renameFolder('Work/Projects','Work/Tasks')"
      - "VG-KEBAB-DELETE: kebab Work -> Delete -> confirm shows count+parent -> confirm -> deleteFolder('Work'); rail refreshes"
