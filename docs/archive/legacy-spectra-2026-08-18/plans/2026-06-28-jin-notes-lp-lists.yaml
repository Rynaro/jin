# ── What ships ────────────────────────────────────────────────────────────────
summary: >
  Extend the SAME pure CM6 decoration builder that already hides inline markers
  (jin-gui/src/lib/notes/livePreview.ts) so it ALSO emits Decoration.replace({widget})
  glyphs: an unordered bullet-list marker (-, *, +) renders as "•" and a GFM task
  marker ([ ]/[x]) renders as ☐/☑ — but ONLY on lines the cursor is not on (the
  existing per-line reveal rule). Ordered-list numbers (1.) are left untouched.
  A task item renders exactly ONE checkbox glyph (never "• ☐"). Single-source
  atomicRanges already covers the new widget ranges because jinLivePreview() provides
  atomicRanges from the SAME DecorationSet. CM6/lezer ONLY — no markdown-it/dompurify,
  no innerHTML.

# ── Firsthand verification done by SPECTRA (do not re-derive; confirm if changed) ─
verified_facts:
  parser_config: "editor.ts:529 and the test helper both use markdown({ base: markdownLanguage }); GFM Task/TaskMarker nodes ARE produced by this config (dumped live). No parser/extension change needed."
  lezer_tree:
    unordered: "BulletList > ListItem > ListMark ; ListMark = EXACTLY the marker char (1 char, e.g. [0,1)). NO trailing space in ListMark (space lives at from+1)."
    ordered:   "OrderedList > ListItem > ListMark ; ListMark = '1.' (2 chars). Discriminator: ListItem.parent.name === 'OrderedList' -> OUT OF SCOPE, skip."
    task:      "BulletList > ListItem > [ ListMark '-' (1 char), Task > TaskMarker ]. TaskMarker = '[ ]'/'[x]'/'[X]' (3 chars). A task item has BOTH a ListMark and a Task child -> this is the double-bullet hazard."
    checked:   "TaskMarker text matches /^\\[[xX]\\]$/ -> checked (☑); '[ ]' -> unchecked (☐). Uppercase [X] is valid checked."
    partial:   "Half-typed '- [ ' parses as ListMark + Paragraph '[ ' (NO Task node) -> treated as a plain bullet, no checkbox, no throw."
    nested:    "'- outer\\n  - inner' -> nested BulletList; inner ListMark at its own offset; each gets its own glyph; monotonic order preserved."
  widget_api: >
    Empirically: Decoration.replace({widget}) exposes the widget via cursor.value.spec.widget
    (custom props like .checked are readable there); plain Decoration.replace({}) has
    spec.widget===undefined and top-level .widget===null. Gates assert via .spec.widget +
    instanceof the exported widget classes. Builder ordering is SAFE: the combined checkbox
    widget's `from` === current ListMark.from, so builder.add is monotonic during in-order iterate().

# ── DECISIONS (resolved) ────────────────────────────────────────────────────────
decisions:
  D-INTERACTIVE:
    decision: "DISPLAY-ONLY for this increment. Checkbox glyphs are NOT clickable yet."
    rationale: >
      (1) The increment's goal is glyph RENDERING; interactivity is a separable UX capability.
      (2) Display-only is a pure additive decoration on the proven foundation: zero new
      doc-mutation paths, zero event plumbing, no posAtDOM edge cases, no risk to
      atomicRanges/caret. (3) No capability is lost — clicking a glyph positions the caret
      on that line, which makes the line active and REVEALS the raw '- [ ]' for editing
      (same reveal-to-edit model already shipped). (4) Keeps buildLivePreviewDecorations PURE
      (no EditorView dependency baked into decoration data), preserving exact-range,
      state-level, mutation-resistant testability that the anti-shallow mandate requires;
      an interactive widget needs a view ref + real DOM-event test modality.
    tradeoff: "To toggle, the user clicks the line and edits [ ]->[x] by hand (one extra step vs a direct click). Accepted for this increment."
    follow_up: "increment #1.5 — see follow_up_spec.D-INTERACTIVE-NEXT below (fully shaped, decision-ready, OUT of committed scope here)."
  D-WIDGET-ATOMIC:
    decision: "Widget replace ranges go into the SAME DecorationSet returned by buildLivePreviewDecorations, so jinLivePreview()'s existing `provide: EditorView.atomicRanges.of(...v.decorations...)` (livePreview.ts:122-123) covers them automatically. Single source of truth unchanged."
    eq: "BulletWidget.eq(o) => o instanceof BulletWidget (all bullets equal). CheckboxWidget.eq(o) => o instanceof CheckboxWidget && o.checked===this.checked (MUST compare checked so [ ]<->[x] rebuilds the glyph)."
    ignoreEvent: "Both widgets: ignoreEvent() => false (editor handles the event -> click positions caret -> line becomes active -> reveal). Forward-compatible with the interactive follow-up, which pairs ignoreEvent=false with a domEventHandler+posAtDOM. Click-to-reveal FEEL is owner-verified via cargo tauri dev."
  D-REVEAL:
    decision: "Unchanged per-line reveal rule. On the active line (any selection range touching the marker's line) emit NO glyph; show raw marker so editing works. Reuses the existing activeLines set (livePreview.ts:55-62)."
  D-BUILDER-SHAPE:
    decision: >
      Extend buildLivePreviewDecorations' iterate() enter() (livePreview.ts:71-83) with a single
      new branch keyed on node.name === 'ListMark' that handles EVERYTHING at ListMark time
      (no separate TaskMarker iteration, no out-of-order add): resolve ordered-vs-bullet via
      grandparent, resolve task-vs-plain via ListItem.getChild('Task'), emit bullet OR combined
      checkbox widget. Keep HIDE_MARK_NODES at exactly 4 entries (its size===4 test at
      livePreview.test.ts:94-103 must stay green) — ListMark is NOT added to that Set; it is
      WIDGET-replaced in its own branch.

# ── Builder algorithm (decision-ready pseudocode for Vivi) ───────────────────────
builder_algorithm:
  location: "jin-gui/src/lib/notes/livePreview.ts — inside iterate().enter(), add a branch BEFORE/after the HIDE_MARK_NODES check"
  steps:
    - "if (node.name !== 'ListMark') -> fall through to existing HIDE_MARK_NODES handling."
    - "lineNo = state.doc.lineAt(node.from).number; if activeLines.has(lineNo) -> return (D-REVEAL: show raw marker)."
    - "n = node.node (materialize SyntaxNode); listItem = n.parent; list = listItem?.parent."
    - "if (list?.name === 'OrderedList') -> return  // ordered numbers untouched (out of scope)."
    - "if (list?.name !== 'BulletList') -> return    // defensive: only bullet lists."
    - "task = listItem.getChild('Task');"
    - "if (task) { taskMarker = task.getChild('TaskMarker'); if (!taskMarker) return; checked = /^\\[[xX]\\]$/.test(state.doc.sliceString(taskMarker.from, taskMarker.to)); builder.add(node.from, taskMarker.to, Decoration.replace({ widget: new CheckboxWidget(checked) })); return; }"
    - "// plain bullet: builder.add(node.from, node.to, Decoration.replace({ widget: new BulletWidget() }));"
  notes:
    - "Combined checkbox covers [ListMark.from, TaskMarker.to) i.e. the whole '- [ ]' -> renders ONE ☐/☑ glyph; the natural space after ']' and the task text remain -> '☐ todo'. This is G-LP-NO-DOUBLE-BULLET by construction (no bullet emitted for task items)."
    - "Plain bullet covers ONLY [ListMark.from, ListMark.to) (the marker char) -> the space after stays -> '• item'."
    - "Reuse the existing replaceDecoration const for empty replaces; create per-widget Decoration.replace({widget}) inline (or memoize a BulletWidget singleton; CheckboxWidget needs 2 instances by checked-state)."
    - "Performance: ListMarks are sparse; n.node + getChild are cheap. Iteration stays over view.visibleRanges (unchanged)."

# ── Widget classes (DOM via createElement/textContent ONLY) ──────────────────────
widgets:
  file: "jin-gui/src/lib/notes/livePreview.ts (export both classes so tests assert via instanceof)"
  BulletWidget:
    glyph: "•  (U+2022)"
    dom: "span.className='cm-bullet-glyph'; span.textContent='•'; span.setAttribute('aria-hidden','true')  // decorative; raw text is source of truth"
    eq: "o instanceof BulletWidget"
    ignoreEvent: "() => false"
  CheckboxWidget:
    fields: "readonly checked: boolean"
    glyph: "☑ (U+2611) when checked, ☐ (U+2610) when unchecked"
    dom: "span.className = 'cm-task-glyph' + (checked ? ' cm-task-glyph--checked' : ''); span.textContent = checked ? '☑' : '☐'; span.setAttribute('aria-hidden','true')"
    eq: "o instanceof CheckboxWidget && o.checked === this.checked"
    ignoreEvent: "() => false"
  hard_rule: "toDOM uses document.createElement + textContent + setAttribute ONLY. NEVER assign .innerHTML. No markdown-it/dompurify import (G-CHOKEPOINT). G-LP-NO-INNERHTML extended."

