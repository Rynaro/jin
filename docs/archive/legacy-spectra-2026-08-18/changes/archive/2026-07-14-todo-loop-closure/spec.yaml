    then: "the bulk status control SHALL offer only `todo` — the intersection of the two tasks' legal successors: `legalNextStatuses('done')` = `[todo]`, `legalNextStatuses('doing')` = `[todo, done, cancelled]`, so `[todo] ∩ [todo, done, cancelled]` = `[todo]`"
    verify_method: "test: jin-gui/src/__tests__/tasks_controller.test.ts#bulk_status_offers_only_intersection_of_legal_transitions"
    constraint: "the R1..R4 example was `{done, todo}` and claimed it yields `[todo]`. That is ARITHMETICALLY IMPOSSIBLE. A status is never its own successor (the FSM has no self-transition arms), so `legalNextStatuses('done')` = `[todo]` and `legalNextStatuses('todo')` = `[doing, done, cancelled]` — their intersection is **EMPTY**. No correct implementation of \"the intersection\" produces `[todo]` from that pair; an implementer who trusted the example and reverse-engineered logic to satisfy it would have built something WRONG that passed its own test. The pair that actually yields `[todo]` — and that matches this criterion's stated intent — is `{done, doing}`. Re-derived mechanically from `can_transition_to`, not from memory. The intersection MUST be computed from S1's `legalNextStatuses` (one FSM mirror, parsed from Rust per AC-S1-04), never from a second hand-typed table."
