acceptance_criteria:   # PARSED from spec.md — 79 criteria, one assertion each
  - id: AC-X-01
    form: event-driven
    scope: "per_pr_gate"
    given: "the tasks surface source tree (`jin-gui/src`) at any story boundary in this wave"
    when: "the verification gate scans it for webview-illegal dialog *call sites*"
    then: "the tasks surface SHALL contain no call to `window.prompt`, `window.alert` or `window.confirm` (they are no-ops in the Tauri webview)"
    verify_method: "command: `rg -n \"window\\.(prompt|alert|confirm)\\s*\\(\" jin-gui/src | rg -v ':\\s*(\\*|//|/\\*)'` returns no match"
    constraint: "the R2 command (`rg -n \"window\\.(prompt|alert|confirm)\" jin-gui/src`) was DEFECTIVE — it could never pass. It matched English prose in comments on the unmodified tree (`lists_controller.ts` header; `notes_controller.ts:390`, which *documents* that `window.prompt()` is a Tauri no-op), in files no story touches. A permanently-red gate trains everyone to ignore it, which is worse than no gate. The replacement requires an opening paren (a call site, not a mention) and drops comment lines. Verified in BOTH directions on the real tree: clean on the current tree, and it still catches an injected `const x = window.confirm(\"really?\")`. It fails CLOSED — a violation hidden in a *trailing* comment (`foo(); // window.confirm(`) still trips it, which is the safe direction."
  - id: AC-X-02
    form: event-driven
    scope: "per_pr_regression_gate"
    given: "a modal introduced by this wave, in the tasks surface mounted from the real `index.html`"
    when: "the modal is opened"
    then: "every modal introduced by this wave SHALL be a `JinModal` instance hosted at `#jin-modal-root`, never a Stimulus-targeted raw `<dialog>`"
    verify_method: "test: jin-gui/src/__tests__/tasks_lists_modal_wiring.test.ts (anti-DT-2 gate, mounts the real index.html)"
  - id: AC-X-03
    form: event-driven
    scope: "story_bound_else_wave_exit(S8)"
    given: "a story that introduces a new `data-lucide` name, or the wave-exit gate after S8 (which owns the icon sweep and creates the test file)"
    when: "`initIcons()` runs against the rendered tasks surface"
    then: "every `data-lucide` icon name rendered by the tasks surface SHALL be registered in `jin-gui/src/lib/icons/index.ts`"
    verify_method: "test: jin-gui/src/__tests__/icons_registry.test.ts#every_task_icon_is_registered (created by S8)"
    constraint: "does NOT bind on a story that introduces no icon (S1 introduces none). An unregistered icon renders nothing, silently — hence the gate; but the gate lives where the icons do."
  - id: AC-X-04
    form: event-driven
    scope: "per_pr_gate"
    given: "the working tree at any story boundary in this wave"
    when: "`make verify` and `make verify-gui` are run (fmt, clippy, cargo test, tsc, vitest, stylelint, vite build)"
    then: "the repository SHALL pass `make verify` and `make verify-gui` (fmt, clippy, cargo test, tsc, vitest, stylelint, vite build) at every story boundary"
    verify_method: "command: `nvm use v24.18.0 && make verify && make verify-gui`"
  - id: AC-X-05
    form: unwanted-behavior
    scope: "per_pr_gate"
    given: "any task or list bridge call in the tasks surface"
    when: "the bridge rejects"
    then: "an `app:error` event SHALL be dispatched on the bubbling channel `error_controller.ts` listens to, with no unhandled promise rejection"
    verify_method: "test: jin-gui/src/__tests__/tasks_error_surfacing.test.ts#every_bridge_callback_surfaces_rejection"
  - id: AC-X-06
    form: event-driven
    scope: "per_pr_regression_gate"
    given: "a task whose `list` is a list id, and a filter carrying that same id"
    when: "`filterTasksList` is called"
    then: "`filterTasksList` SHALL keep matching `task.list` against a list **id** (never a name)"
    verify_method: "test: jin-gui/src/__tests__/tasks_controller.test.ts#S6_filter_is_id_based"
  - id: AC-X-07
    form: event-driven
    scope: "story_bound_else_wave_exit(S6)"
    given: "a task file written before this wave (no `parent` key in its frontmatter), at S6 or later — no core change lands before S6"
    when: "the current core parses it"
    then: "it SHALL parse without error, with every new frontmatter field taking its `#[serde(default)]` value"
    verify_method: "test: jin-core/src/model/task.rs#serde_default_legacy_task_file_parses_without_parent (created by S6)"
    constraint: "not applicable to S1..S5, which touch no Rust. Binds the moment S6 adds `parent`, and again at wave exit."
  - id: AC-X-08
    form: event-driven
    scope: "per_pr_gate"
    given: "any task-mutating bridge call in the tasks surface (`createTask`, `editTask`, `setTaskStatus`, `moveTask`, `deleteTask`, `reseedPositions`)"
    when: "the call resolves successfully"
    then: "a `jin:tasks-changed` event SHALL be dispatched by the `mutate()` chokepoint (Approach §8), never by a per-callback bespoke dispatch"
    verify_method: "test: jin-gui/src/__tests__/tasks_error_surfacing.test.ts#every_task_mutation_dispatches_tasks_changed — the test drives each mutating callback and asserts the event fires; a story that adds a mutating call outside `mutate()` fails this criterion"
  - id: AC-S1-01
    form: event-driven
    scope: "story:S1"
    given: "the GUI source tree after S1"
    when: "the verification gate scans it for a `critical` priority *literal*"
    then: "the priority options offered anywhere in the GUI SHALL be exactly `none`, `low`, `medium`, `high`"
    verify_method: "command: `rg -n \"'critical'|\\\"critical\\\"\" jin-gui/src/lib jin-gui/src/controllers jin-gui/index.html` returns no match"
    constraint: "the R2 command (`rg -n \"critical\" jin-gui/src`) was DEFECTIVE — it could never pass. It matched the ordinary English word in `settings_controller.ts`, `settings.css`, `livePreview.ts` and `today_controller.test.ts` (\"the critical caveat\", \"non-critical\", \"critical for…\"). The defect was never the word; it was a phantom `'critical'` **`Priority` option** (`render.ts:921`) that hard-errors at `parse_priority`. The replacement matches the quoted literal only. Verified in BOTH directions on the real tree: clean on the S1 tree (the phantom option is genuinely gone from `render.ts`), and it catches a reintroduced `PRIORITY_OPTIONS = [… ,'critical']`. scope narrowed to exclude `__tests__` — an anti-regression test that asserts the literal is ABSENT (`expect(PRIORITY_OPTIONS).not.toContain('critical')`) would otherwise turn this gate permanently red, which is the exact class of defect it is being fixed for. Audited: clean on the S1 tree."
  - id: AC-S1-02
    form: event-driven
    scope: "story:S1"
    given: "a task whose status is `done`"
    when: "the detail pane renders its status select"
    then: "the detail status select SHALL render exactly two options — `done` (current) and `todo` (the only legal successor)"
    verify_method: "test: jin-gui/src/__tests__/tasks_controller.test.ts#status_select_offers_only_legal_transitions_for_done"
  - id: AC-S1-03
    form: event-driven
    scope: "story:S1"
    given: "a task whose status is `cancelled`"
    when: "the detail pane renders its status select"
    then: "the detail status select SHALL NOT render a `done` option"
    verify_method: "test: jin-gui/src/__tests__/tasks_controller.test.ts#status_select_hides_done_for_cancelled"
  - id: AC-S1-04
    form: event-driven
    scope: "story:S1"
    given: "each of the five `TaskStatus` values in turn"
    when: "`legalNextStatuses` is called with it"
    then: "`legalNextStatuses` SHALL return, for each of the five statuses, exactly the successor set encoded by `TaskStatus::can_transition_to` in `jin-core/src/model/task.rs:49-61`"
    verify_method: "test: jin-gui/src/__tests__/tasks_controller.test.ts#legal_next_statuses_mirrors_core_fsm — derived from the Rust source, with the 8-arm anti-vacuity guard"
    constraint: "this is a CROSS-LANGUAGE PARITY criterion and it is satisfiable-while-useless by the obvious implementation. A TS test asserting a TS table against a second TS table is both-sides-TypeScript: changing `can_transition_to` in **Rust** would not fail it, which is the entire failure mode this criterion exists to prevent. The test MUST therefore derive its expected map by PARSING the Rust source (`jin-core/src/model/task.rs`, the `matches!` arms of `can_transition_to`) — not by re-typing the pairs in TypeScript. It MUST carry an ANTI-VACUITY GUARD: assert the parse found exactly 8 arms (todo→doing, todo→done, todo→cancelled, doing→done, doing→cancelled, doing→todo, done→todo, cancelled→todo) and fail LOUDLY if it finds zero — a parser that silently matches nothing turns this into a test that passes against an empty expectation. Same reasoning as AC-S6-04's anti-mock clause: when the bug class is \"the two sides drift apart\", a test that reads only one side certifies the drift."
  - id: AC-S1-05
    form: unwanted-behavior
    scope: "story:S1"
    given: "the detail editor's priority save"
    when: "`editTask` rejects"
    then: "the controller SHALL dispatch `app:error` rather than swallow the rejection"
    verify_method: "test: jin-gui/src/__tests__/tasks_error_surfacing.test.ts#priority_save_rejection_dispatches_app_error"
  - id: AC-S1-06
    form: event-driven
    scope: "story:S1"
    given: "the view is set to `board`"
    when: "the user switches from one list to another"
    then: "the view SHALL remain `board` (view is a global preference in `localStorage['jin.tasks.view']`)"
    verify_method: "test: jin-gui/src/__tests__/tasks_controller.test.ts#view_persists_globally_across_list_switch"
  - id: AC-S1-07
    form: event-driven
    scope: "story:S1"
    given: "the GUI source tree after S1 (view state now lives in `localStorage['jin.tasks.view']`)"
    when: "the verification gate scans it for `editList` calls carrying a `view` key"
    then: "the GUI SHALL make no call to `editList` with a `view` key"
    verify_method: "command: `rg -nU \"editList\\([^)]*view\" jin-gui/src/controllers jin-gui/src/lib` returns no match"
    constraint: "the R2 command was DEFECTIVE IN THE PERMISSIVE DIRECTION — the opposite of the other three, and the more dangerous one for a removal gate. `rg` is line-based by default, so a reintroduced call formatted across lines (`editList(id, {\\n  view: newView,\\n })`) MISSES entirely; verified against an injected probe. `-U` (multiline) closes that hole, but an unscoped `-U` regex is then permanently RED on `invoke.ts:237`, where the bridge wrapper legitimately DECLARES `view?: string` in its input type — the core keeps the field; only the GUI stops calling it. Hence: multiline AND scoped to call sites. Audited both directions: clean on the tree, catches the multi-line injection."
